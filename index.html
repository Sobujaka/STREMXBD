<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Streaming Website</title>
    <!-- HLS.js লাইব্রেরি যা লাইভ টিভি স্ট্রিম চালাতে সাহায্য করবে -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }
        .player-container { display: flex; gap: 20px; background: #1e1e1e; padding: 20px; border-radius: 8px; }
        video { width: 100%; max-height: 450px; background: #000; border-radius: 4px; }
        .playlist { width: 300px; max-height: 450px; overflow-y: auto; background: #2a2a2a; padding: 10px; border-radius: 4px; }
        .channel-item { display: flex; align-items: center; gap: 10px; padding: 10px; background: #333; margin-bottom: 8px; cursor: pointer; border-radius: 4px; transition: 0.2s; }
        .channel-item:hover { background: #444; }
        .channel-item img { width: 40px; height: 40px; object-fit: contain; background: #fff; border-radius: 4px; padding: 2px; }
    </style>
</head>
<body>

    <h2>Live TV & Media Player</h2>
    <div class="player-container">
        <!-- ভিডিও প্লেয়ার সেকশন -->
        <div style="flex: 1;">
            <video id="videoPlayer" controls autoplay></video>
        </div>
        <!-- চ্যানেল লিস্ট সেকশন -->
        <div class="playlist" id="channelList">
            <p>Loading channels...</p>
        </div>
    </div>

    <script>
        const workerUrl = "আপনার_ক্লাউডফ্লাওয়ার_ওয়ার্কারের_লিংক_এখানে_দিন";
        const videoElement = document.getElementById('videoPlayer');

        function playVideo(url) {
            if (url.includes('.m3u8')) {
                if (Hls.isSupported()) {
                    const hls = new Hls();
                    hls.loadSource(url);
                    hls.attachMedia(videoElement);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        videoElement.play();
                    });
                } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
                    videoElement.src = url;
                    videoElement.addEventListener('loadedmetadata', () => {
                        videoElement.play();
                    });
                }
            } else {
                videoElement.src = url;
                videoElement.play();
            }
        }

        // ক্লাউডফ্লাওয়ার থেকে ডাটা ফেচ করা
        async function loadChannels() {
            try {
                let response = await fetch(workerUrl);
                let data = await response.json();
                
                let listContainer = document.getElementById('channelList');
                listContainer.innerHTML = "";

                data.forEach(category => {
                    if (category.type === "tv-channel" && category.CN) {
                        for (let key in category.CN) {
                            let ch = category.CN[key];
                            let div = document.createElement('div');
                            div.className = 'channel-item';
                            div.innerHTML = `
                                <img src="${ch.tvglogo || 'https://via.placeholder.com/40'}" alt="${ch.name}">
                                <div>
                                    <strong>${ch.name}</strong><br>
                                    <small>${ch.group}</small>
                                </div>
                            `;
                            div.onclick = () => playVideo(ch.url);
                            listContainer.appendChild(div);
                        }
                    }
                });
            } catch (error) {
                console.error("Error loading channels:", error);
            }
        }

        loadChannels();
    </script>
</body>
</html>
