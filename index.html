<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STREMXBD - Best Streaming Site</title>
    <!-- HLS.js & Artplayer -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js"></script>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0b1120; color: #ffffff; padding: 20px; }
        #home-view, #history-fav-view { display: block; }
        #history-fav-view { display: none; }
        .navbar { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; margin-bottom: 25px; position: relative; }
        .search-box { flex-grow: 1; min-width: 200px; background: #111827; border: 1px solid #1f2937; padding: 10px 18px; border-radius: 20px; color: #fff; outline: none; }
        .nav-link { background: none; border: none; color: #94a3b8; font-size: 15px; cursor: pointer; padding: 4px 8px; }
        .nav-link.active { color: #3b82f6; font-weight: 600; }
        .select-link { background: transparent; border: none; color: #3b82f6; font-size: 14px; cursor: pointer; outline: none; }
        
        /* Profile UI */
        .profile-container { position: relative; margin-left: auto; z-index: 1000; }
        .profile-icon { width: 38px; height: 38px; border-radius: 50%; background: #1f2937; border: 2px solid #3b82f6; cursor: pointer; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .profile-icon img { width: 100%; height: 100%; object-fit: cover; }
        .profile-icon svg { width: 22px; height: 22px; fill: #94a3b8; }
        .user-dropdown { position: absolute; top: 45px; right: 0; background: #161e2e; border: 1px solid #1f2937; border-radius: 8px; width: 200px; display: none; flex-direction: column; box-shadow: 0 10px 15px rgba(0,0,0,0.5); }
        .user-dropdown.show { display: flex; }
        .dropdown-item { padding: 12px 16px; font-size: 14px; color: #fff; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .dropdown-item:hover { background: #1f2937; }

        /* Media Grid & Card */
        .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
        .card { background: #161e2e; border-radius: 8px; overflow: hidden; position: relative; cursor: pointer; border: 1px solid #1f2937; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); border-color: #3b82f6; }
        .card-image-wrapper { width: 100%; aspect-ratio: 2/3; background: #0f172a; }
        .square-box { aspect-ratio: 1/1 !important; }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .card-info { padding: 8px; }
        .card-title { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Favorite Button */
        .fav-btn { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.6); border-radius: 50%; width: 28px; height: 28px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; }
        .fav-btn svg { width: 16px; height: 16px; fill: #94a3b8; }
        .fav-btn.active svg { fill: #ef4444; }

        /* Player View */
        #player-view { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0b1120; z-index: 9999; padding: 20px; overflow-y: auto; }
        .player-container { display: flex; gap: 20px; max-width: 1400px; margin: 0 auto; background: #0f172a; padding: 20px; border-radius: 12px; }
        .video-wrapper { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; overflow: hidden; }
        .player-sidebar { width: 300px; background: #161e2e; padding: 15px; border-radius: 8px; max-height: 80vh; overflow-y: auto; }
        .back-btn { background: #ef4444; color: #fff; border: none; padding: 10px; border-radius: 6px; cursor: pointer; margin-bottom: 10px; width: 100%; }

        @media (max-width: 900px) { .player-container { flex-direction: column; } .player-sidebar { width: 100%; } }
    </style>
</head>
<body>

    <div id="home-view">
        <div class="navbar">
            <input type="text" id="searchInput" class="search-box" placeholder="Search movies, series..." oninput="applyFilters()">
            <button class="nav-link active" onclick="filterTab('All', this)">All</button>
            <button class="nav-link" onclick="filterTab('Anime', this)">Anime</button>
            <button class="nav-link" onclick="filterTab('Movie', this)">Movie</button>
            <button class="nav-link" onclick="filterTab('TV Series', this)">Series</button>
            <button class="nav-link" onclick="filterTab('Live TV', this)">Live TV</button>

            <div class="profile-container">
                <div class="profile-icon" id="profileIcon" onclick="document.getElementById('userDropdown').classList.toggle('show')">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
                </div>
                <div class="user-dropdown" id="userDropdown">
                    <div id="userInfo" style="padding: 12px; border-bottom: 1px solid #334155; display: none;">
                        <div id="uName" style="font-weight: 600; font-size: 14px;"></div>
                    </div>
                    <div class="dropdown-item" onclick="showSection('fav')">❤ Favorites</div>
                    <div class="dropdown-item" onclick="showSection('history')">🕒 History</div>
                    <div class="dropdown-item" id="loginBtn" onclick="handleAuth()">Login with Google</div>
                    <div class="dropdown-item" id="logoutBtn" style="display: none; color: #ef4444;" onclick="logout()">Logout</div>
                </div>
            </div>
        </div>
        <div id="main-content"></div>
    </div>

    <div id="history-fav-view">
        <div class="view-header">
            <h2 id="viewTitle" style="margin-bottom: 15px;">List</h2>
            <button class="back-btn" style="width: auto;" onclick="closeSection()">Back to Home</button>
        </div>
        <div id="sec-content" class="media-grid"></div>
    </div>

    <div id="player-view">
        <div class="player-container">
            <div style="flex: 1;">
                <h2 id="vTitle" style="margin-bottom: 10px;"></h2>
                <div class="video-wrapper">
                    <iframe id="ifr" style="width:100%; height:100%; display:none;" allowfullscreen></iframe>
                    <div id="art" style="width:100%; height:100%; display:none;"></div>
                </div>
            </div>
            <div class="player-sidebar">
                <button class="back-btn" onclick="closePlayer()">✕ Close Player</button>
                <div id="sideContent"></div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCYpyD5bDR2PCVvZR0HHnb410EJWRuZITg",
            authDomain: "anime-stream-bd.firebaseapp.com",
            databaseURL: "https://anime-stream-bd-default-rtdb.firebaseio.com",
            projectId: "anime-stream-bd",
            storageBucket: "anime-stream-bd.firebasestorage.app",
            messagingSenderId: "664804369599",
            appId: "1:664804369599:web:c2ce67b0e0e4a59050520a"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();

        auth.onAuthStateChanged(user => {
            const icon = document.getElementById('profileIcon');
            const uInfo = document.getElementById('userInfo');
            if (user) {
                icon.innerHTML = `<img src="${user.photoURL}">`;
                uInfo.style.display = 'block';
                document.getElementById('uName').innerText = user.displayName;
                document.getElementById('loginBtn').style.display = 'none';
                document.getElementById('logoutBtn').style.display = 'block';
            } else {
                icon.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>`;
                uInfo.style.display = 'none';
                document.getElementById('loginBtn').style.display = 'block';
                document.getElementById('logoutBtn').style.display = 'none';
            }
        });

        function handleAuth() { auth.signInWithPopup(provider); }
        function logout() { auth.signOut(); }

        const jsonSources = [
            { name: "Anime", url: "https://raw.githubusercontent.com/Sobujaka/STREMXBD/refs/heads/main/anime.json" },
            { name: "Movie", url: "https://raw.githubusercontent.com/Sobujaka/STREMXBD/refs/heads/main/movies.json" },
            { name: "TV Series", url: "https://raw.githubusercontent.com/Sobujaka/STREMXBD/refs/heads/main/tv-sriese.json" },
            { name: "Live TV", url: "https://raw.githubusercontent.com/Sobujaka/STREMXBD/refs/heads/main/live-tv.json" }
        ];

        let loadedData = {}, currentTab = 'All', watchHistory = JSON.parse(localStorage.getItem('h') || '[]'), favorites = JSON.parse(localStorage.getItem('f') || '[]');

        async function loadData() {
            for (let s of jsonSources) {
                try {
                    const res = await fetch(s.url);
                    const text = await res.text();
                    loadedData[s.name] = JSON.parse(text.replace(/\\n/g, '').replace(/\\r/g, ''));
                } catch(e) { console.log(s.name + " Load Error"); }
            }
            render();
        }

        function render(items) {
            const container = document.getElementById('main-content');
            container.innerHTML = '';
            let list = items || [];
            if (!items) {
                if (currentTab === 'All') {
                    list = [...(loadedData['Anime']||[]), ...(loadedData['Movie']||[]), ...(loadedData['TV Series']||[])];
                } else {
                    list = loadedData[currentTab] || [];
                }
            }
            const grid = document.createElement('div');
            grid.className = 'media-grid';
            list.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                const isFav = favorites.some(f => (f.name||f.title) === (item.name||item.title));
                card.innerHTML = `
                    <button class="fav-btn ${isFav?'active':''}" onclick="event.stopPropagation(); toggleFav(this, ${JSON.stringify(item).replace(/"/g, '&quot;')})">
                        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    </button>
                    <div class="card-image-wrapper ${item.type==='tv-channel'?'square-box':''}">
                        <img src="${item.image||''}" loading="lazy">
                    </div>
                    <div class="card-info"><div class="card-title">${item.name||item.title||item.country}</div></div>
                `;
                card.onclick = () => openPlayer(item);
                grid.appendChild(card);
            });
            container.appendChild(grid);
        }

        function toggleFav(btn, item) {
            const idx = favorites.findIndex(f => (f.name||f.title) === (item.name||item.title));
            if (idx > -1) { favorites.splice(idx, 1); btn.classList.remove('active'); }
            else { favorites.push(item); btn.classList.add('active'); }
            localStorage.setItem('f', JSON.stringify(favorites));
        }

        function openPlayer(item) {
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('history-fav-view').style.display = 'none';
            document.getElementById('player-view').style.display = 'block';
            document.getElementById('vTitle').innerText = item.name||item.title;
            
            // Save History
            watchHistory = watchHistory.filter(h => (h.name||h.title) !== (item.name||item.title));
            watchHistory.unshift(item);
            if (watchHistory.length > 50) watchHistory.pop();
            localStorage.setItem('h', JSON.stringify(watchHistory));

            const url = item["Movie link"] || item.url || (item.episodes ? Object.values(item.episodes)[0] : '');
            loadVideo(url);
        }

        function loadVideo(url) {
            const ifr = document.getElementById('ifr');
            const art = document.getElementById('art');
            if (url.includes('.m3u8') || url.includes('.mp4')) {
                ifr.style.display = 'none'; art.style.display = 'block';
                new Artplayer({ container: '#art', url: url, autoplay: true, fullscreen: true, pip: true });
            } else {
                art.style.display = 'none'; ifr.style.display = 'block'; ifr.src = url;
            }
        }

        function filterTab(t, btn) {
            document.querySelectorAll('.nav-link').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentTab = t; render();
        }

        function showSection(type) {
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('history-fav-view').style.display = 'block';
            document.getElementById('viewTitle').innerText = type === 'fav' ? 'My Favorites' : 'Watch History';
            const list = type === 'fav' ? favorites : watchHistory;
            const content = document.getElementById('sec-content');
            content.innerHTML = '';
            list.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<img src="${item.image}"><div class="card-info">${item.name||item.title}</div>`;
                card.onclick = () => openPlayer(item);
                content.appendChild(card);
            });
            document.getElementById('userDropdown').classList.remove('show');
        }

        function closePlayer() { document.getElementById('player-view').style.display = 'none'; document.getElementById('home-view').style.display = 'block'; document.getElementById('ifr').src = ''; }
        function closeSection() { document.getElementById('history-fav-view').style.display = 'none'; document.getElementById('home-view').style.display = 'block'; }
        
        loadData();
    </script>
</body>
</html>
