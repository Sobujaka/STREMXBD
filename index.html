<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STREMXBD Streaming App</title>
    <!-- HLS.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- Artplayer.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b1120;
            color: #ffffff;
            padding: 20px;
        }

        #home-view { display: block; }

        .navbar {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            padding: 10px 0;
            margin-bottom: 25px;
        }

        .search-box {
            flex-grow: 1;
            min-width: 200px;
            background-color: #111827;
            border: 1px solid #1f2937;
            padding: 10px 18px;
            border-radius: 20px;
            color: #94a3b8;
            font-size: 14px;
            outline: none;
        }

        .nav-link {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            padding: 4px 8px;
        }

        .nav-link.active { color: #3b82f6; font-weight: 600; }

        .select-link {
            background: transparent;
            border: none;
            color: #3b82f6;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
        }

        .select-link option { background-color: #0f172a; color: #ffffff; }

        .media-grid {
            display: grid;
            grid-template-columns: repeat(8, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 30px;
        }

        .card {
            background-color: #161e2e;
            border-radius: 6px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            border: 1px solid #1f2937;
            transition: transform 0.2s, border-color 0.2s;
        }

        .card:hover { transform: translateY(-5px); border-color: #3b82f6; }

        .card-image-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 2 / 3;
            background-color: #0f172a;
        }

        .card-image-wrapper.square-box { aspect-ratio: 1 / 1; }

        .card img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .card-info { padding: 6px 8px; }

        .card-title {
            font-size: 11px;
            font-weight: 600;
            color: #f8fafc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-transform: capitalize;
        }

        #player-view {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #0b1120;
            z-index: 9999;
            padding: 20px;
            overflow-y: auto;
        }

        .player-container {
            display: flex;
            gap: 20px;
            max-width: 1600px;
            margin: 0 auto;
            background: #0f172a;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #1f2937;
        }

        .player-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 0;
        }

        .player-title {
            font-size: 20px;
            font-weight: 600;
            color: #3b82f6;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-bottom: 2px;
        }

        .video-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .video-wrapper iframe, .artplayer-app {
            width: 100%;
            height: 100%;
            border: none;
        }

        .player-sidebar-wrapper {
            width: 300px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .back-btn {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            width: 100%;
            text-align: center;
            align-self: flex-end;
            transition: background 0.2s;
        }

        .back-btn:hover { background: #dc2626; }

        .player-sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #161e2e;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #1f2937;
            max-height: 78vh;
            overflow-y: auto;
        }

        .filter-group { display: flex; flex-direction: column; gap: 5px; }
        .filter-group label { font-size: 12px; color: #94a3b8; }
        .filter-group select {
            background: #0f172a;
            color: #fff;
            border: 1px solid #1f2937;
            padding: 8px;
            border-radius: 5px;
            outline: none;
        }

        .episodes-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .ep-btn {
            background: #0f172a;
            border: 1px solid #1f2937;
            color: #fff;
            padding: 8px 0;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
        }

        .ep-btn:hover, .ep-btn.active { background: #3b82f6; border-color: #3b82f6; }

        .channel-list { display: flex; flex-direction: column; gap: 8px; }

        .channel-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #0f172a;
            padding: 8px;
            border-radius: 5px;
            cursor: pointer;
            border: 1px solid #1f2937;
        }

        .channel-item:hover, .channel-item.active { border-color: #3b82f6; background: #1e293b; }
        .channel-item img { width: 35px; height: 35px; object-fit: contain; border-radius: 4px; }
        .channel-item span { font-size: 13px; font-weight: 500; }

        #adblock-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: rgba(11, 17, 32, 0.98);
            z-index: 999999;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .adblock-box {
            background-color: #161e2e;
            border: 2px solid #ef4444;
            padding: 30px;
            border-radius: 12px;
            max-width: 450px;
        }

        .adblock-box h2 { color: #ef4444; font-size: 22px; margin-bottom: 12px; }
        .adblock-box p { color: #94a3b8; font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
        .adblock-box button { background: #3b82f6; color: #fff; border: none; padding: 10px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; }

        @media (max-width: 1024px) {
            .player-container { flex-direction: column; }
            .player-sidebar-wrapper { width: 100%; }
            .media-grid { grid-template-columns: repeat(4, 1fr); }
        }

        @media (max-width: 600px) { 
            body { padding: 10px; }
            .media-grid { grid-template-columns: repeat(2, 1fr); } 
            #player-view { padding: 0; background-color: #0f172a; }
            .player-container { border-radius: 0; border: none; padding: 10px; gap: 12px; }
            .player-title { font-size: 15px; }
            .video-wrapper { border-radius: 6px; box-shadow: none; }
            .player-sidebar { max-height: none; padding: 10px; }
            .episodes-grid { grid-template-columns: repeat(4, 1fr); }
        }
    </style>
</head>
<body>

    <div id="adblock-overlay">
        <div class="adblock-box">
            <h2>AdBlocker Detected!</h2>
            <p>আপনার ব্রাউজারে অ্যাড ব্লকার চালু রয়েছে। দয়া করে অ্যাড ব্লকার ডিজেবল করুন এবং রিফ্রেশ দিন।</p>
            <button onclick="window.location.reload()">Refresh Page</button>
        </div>
    </div>

    <div id="home-view">
        <div class="navbar">
            <input type="text" id="searchInput" class="search-box" placeholder="Search title..." oninput="applyFilters()">
            <button class="nav-link active" onclick="filterTab('All', this)">All</button>
            <button class="nav-link" onclick="filterTab('Anime', this)">Anime</button>
            <button class="nav-link" onclick="filterTab('Movie', this)">Movie</button>
            <button class="nav-link" onclick="filterTab('TV Series', this)">TV Series</button>
            <button class="nav-link" onclick="filterTab('Live TV', this)">Live TV</button>

            <select id="countrySelect" class="select-link" onchange="applyFilters()"><option value="all">Country: All</option></select>
            <select id="categorySelect" class="select-link" onchange="applyFilters()"><option value="all">Category: All</option></select>
            <select id="languageSelect" class="select-link" onchange="applyFilters()"><option value="all">Language: All</option></select>
        </div>
        <div id="main-content"></div>
    </div>

    <div id="player-view">
        <div class="player-container">
            <div class="player-main">
                <h2 id="videoTitle" class="player-title"></h2>
                <div class="video-wrapper" id="videoContainer">
                    <iframe id="iframePlayer" src="" allowfullscreen style="display:none;"></iframe>
                    <div id="artPlayerContainer" class="artplayer-app" style="display:none;"></div>
                </div>
            </div>

            <div class="player-sidebar-wrapper">
                <button class="back-btn" onclick="closePlayerPage()">Back to Home →</button>
                <div id="playerSidebar" class="player-sidebar"></div>
            </div>
        </div>
    </div>

    <script>
        async function checkAdBlocker() {
            const googleAdUrl = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js';
            try {
                await fetch(googleAdUrl, { method: 'HEAD', mode: 'no-cors' });
                const fakeAd = document.createElement('div');
                fakeAd.innerHTML = '&nbsp;';
                fakeAd.className = 'adsbox ads-box ad-zone ad-space google-ad';
                document.body.appendChild(fakeAd);
                
                setTimeout(() => {
                    if (fakeAd.offsetHeight === 0) showAdBlockWarning();
                    fakeAd.remove();
                }, 100);
            } catch (error) {
                showAdBlockWarning();
            }
        }

        function showAdBlockWarning() {
            document.getElementById('adblock-overlay').style.display = 'flex';
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('player-view').style.display = 'none';
        }

        window.addEventListener('load', checkAdBlocker);

        const jsonSources = [
            { name: "Anime", url: "https://raw.githubusercontent.com/Sobujaka/STREMXBD/refs/heads/main/anime.json" },
            { name: "Movie", url: "https://raw.githubusercontent.com/Sobujaka/STREMXBD/refs/heads/main/movies.json" },
            { name: "TV Series", url: "https://raw.githubusercontent.com/Sobujaka/STREMXBD/refs/heads/main/tv-sriese.json" },
            { name: "Live TV", url: "https://raw.githubusercontent.com/Sobujaka/STREMXBD/refs/heads/main/tv.json" }
        ];

        let loadedData = {}, currentTab = 'All', artInstance = null, hlsInstance = null;
        let previousScrollPosition = 0;

        function repairAndParseJSON(jsonText) {
            try {
                return JSON.parse(jsonText);
            } catch (e) {
                try {
                    let cleaned = jsonText.replace(/"\s*\n*\r*\s*"/g, '","')
                                         .replace(/([0-9]|"|true|false|null)\s*\n*\r*\s*"([^"]+)":/g, '$1,"$2":')
                                         .replace(/,\s*([\]}])/g, '$1');
                    return JSON.parse(cleaned);
                } catch (repairError) {
                    return new Function("return " + jsonText)();
                }
            }
        }

        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        async function loadAllJSON() {
            const fetchPromises = jsonSources.map(source => 
                fetch(source.url)
                    .then(res => res.text())
                    .then(textData => ({ category: source.name, data: repairAndParseJSON(textData) }))
                    .catch(err => ({ category: source.name, data: [] }))
            );

            const results = await Promise.allSettled(fetchPromises);
            results.forEach(result => {
                if (result.status === 'fulfilled' && result.value.data) {
                    loadedData[result.value.category] = result.value.data;
                }
            });

            populateDropdowns();
            applyFilters();
        }

        function populateDropdowns() {
            const countries = new Set(), categories = new Set(), languages = new Set();
            ['Anime', 'Movie', 'TV Series'].forEach(cat => {
                if (loadedData[cat] && Array.isArray(loadedData[cat])) {
                    loadedData[cat].forEach(item => {
                        if (item.country) countries.add(item.country);
                        if (item.category) categories.add(item.category);
                        if (item.language) languages.add(item.language);
                    });
                }
            });
            fillSelect('countrySelect', 'Country', Array.from(countries));
            fillSelect('categorySelect', 'Category', Array.from(categories));
            fillSelect('languageSelect', 'Language', Array.from(languages));
        }

        function fillSelect(id, label, options) {
            const select = document.getElementById(id);
            select.innerHTML = `<option value="all">${label}: All</option>`;
            options.forEach(opt => select.appendChild(new Option(opt, opt)));
        }

        function filterTab(tabName, element) {
            document.querySelectorAll('.nav-link').forEach(btn => btn.classList.remove('active'));
            if(element) element.classList.add('active');
            currentTab = tabName;
            const isLiveTV = tabName === 'Live TV';
            document.getElementById('countrySelect').disabled = isLiveTV;
            document.getElementById('categorySelect').disabled = isLiveTV;
            document.getElementById('languageSelect').disabled = isLiveTV;
            applyFilters();
        }

        function applyFilters() {
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const countryVal = document.getElementById('countrySelect').value;
            const categoryVal = document.getElementById('categorySelect').value;
            const languageVal = document.getElementById('languageSelect').value;

            let items = [];
            if (currentTab === 'All') {
                if (loadedData['Anime']) items.push(...loadedData['Anime']);
                if (loadedData['Movie']) items.push(...loadedData['Movie']);
                if (loadedData['TV Series']) items.push(...loadedData['TV Series']);
            } else if (loadedData[currentTab]) {
                items = loadedData[currentTab];
            }

            let filtered = items.filter(item => {
                if (!item) return false;
                if (currentTab === 'Live TV' || item.type === 'tv-channel') {
                    return (item.country || '').toLowerCase().includes(searchVal);
                }
                const title = (item.name || item.title || '').toLowerCase();
                return title.includes(searchVal) &&
                    (countryVal === 'all' || item.country === countryVal) &&
                    (categoryVal === 'all' || item.category === categoryVal) &&
                    (languageVal === 'all' || item.language === languageVal);
            });

            const grouped = groupItemsByName(filtered);
            renderGrid(currentTab !== 'Live TV' ? shuffleArray(grouped) : grouped);
        }

        function groupItemsByName(items) {
            const map = new Map();
            items.forEach(item => {
                if (!item) return;
                if (item.type === "tv-channel") {
                    const key = "tv_" + item.country;
                    if (!map.has(key)) map.set(key, item);
                    return;
                }
                const title = (item.name || item.title || "Untitled").trim();
                const key = title.toLowerCase();

                if (!map.has(key)) {
                    map.set(key, { ...item, title: title, languagesMap: { [item.language || 'Default']: item } });
                } else {
                    map.get(key).languagesMap[item.language || 'Default'] = item;
                }
            });
            return Array.from(map.values());
        }

        function renderGrid(items) {
            const mainContent = document.getElementById('main-content');
            mainContent.innerHTML = '';
            const grid = document.createElement('div');
            grid.className = 'media-grid';

            items.forEach(item => {
                const isSquare = item.type === "tv-channel";
                const displayTitle = isSquare ? item.country : (item.title || item.name || "Untitled");
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openPlayerPage(item);
                card.innerHTML = `
                    <div class="card-image-wrapper ${isSquare ? 'square-box' : ''}">
                        <img src="${item.image || ''}" alt="${displayTitle}">
                    </div>
                    <div class="card-info">
                        <div class="card-title">${displayTitle}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
            mainContent.appendChild(grid);
        }

        function openPlayerPage(item) {
            previousScrollPosition = window.scrollY || document.documentElement.scrollTop;
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('player-view').style.display = 'block';
            document.getElementById('player-view').scrollTop = 0;

            const sidebar = document.getElementById('playerSidebar');
            sidebar.innerHTML = '';

            if (item.type === "tv-channel") {
                setupLiveTVPlayer(item, sidebar);
            } else if (item.episodes || (item.languagesMap && Object.values(item.languagesMap)[0].episodes)) {
                setupSeriesPlayer(item, sidebar);
            } else {
                setupMoviePlayer(item, sidebar);
            }
        }

        function setupMoviePlayer(item, sidebar) {
            const languagesMap = item.languagesMap || { [item.language || 'Default']: item };
            const langKeys = Object.keys(languagesMap);
            let langOptions = langKeys.map(lang => `<option value="${lang}">${lang}</option>`).join('');

            sidebar.innerHTML = `<div class="filter-group"><label>Language</label><select id="movieLangSelect">${langOptions}</select></div>`;
            const langSelect = document.getElementById('movieLangSelect');

            function playSelectedLanguage(lang) {
                const currentItem = languagesMap[lang] || item;
                const movieUrl = currentItem["Movie link"] || currentItem["movie_link"] || currentItem.link || currentItem.url || '';
                loadVideo(movieUrl, `${currentItem.title || currentItem.name} (${lang})`);
            }
            langSelect.onchange = (e) => playSelectedLanguage(e.target.value);
            playSelectedLanguage(langKeys[0]);
        }

        function setupSeriesPlayer(item, sidebar) {
            const languagesMap = item.languagesMap || { [item.language || 'Default']: item };
            const langKeys = Object.keys(languagesMap);
            let langOptions = langKeys.map(lang => `<option value="${lang}">${lang}</option>`).join('');

            sidebar.innerHTML = `
                <div class="filter-group"><label>Language</label><select id="langSelect">${langOptions}</select></div>
                <div class="filter-group"><label>Season</label><select id="seasonSelect"></select></div>
                <div class="filter-group"><label>Episodes</label><div id="episodesGrid" class="episodes-grid"></div></div>
            `;

            const langSelect = document.getElementById('langSelect');
            const seasonSelect = document.getElementById('seasonSelect');
            const epGrid = document.getElementById('episodesGrid');

            function loadSeriesContent(selectedLang) {
                const activeItem = languagesMap[selectedLang] || item;
                const episodes = activeItem.episodes || {};
                const seasonsMap = {};

                Object.keys(episodes).forEach(key => {
                    const match = key.match(/(S\d+)(EP\d+)/i);
                    if (match) {
                        const season = match[1].toUpperCase(), ep = match[2].toUpperCase();
                        if (!seasonsMap[season]) seasonsMap[season] = [];
                        seasonsMap[season].push({ epName: ep, url: episodes[key] });
                    } else {
                        if (!seasonsMap['S1']) seasonsMap['S1'] = [];
                        seasonsMap['S1'].push({ epName: key, url: episodes[key] });
                    }
                });

                seasonSelect.innerHTML = Object.keys(seasonsMap).map(s => `<option value="${s}">Season ${s.replace('S', '')}</option>`).join('');

                function renderEpisodes(selectedSeason) {
                    epGrid.innerHTML = '';
                    (seasonsMap[selectedSeason] || []).forEach((epData, index) => {
                        const btn = document.createElement('button');
                        btn.className = 'ep-btn';
                        btn.innerText = epData.epName;
                        btn.onclick = () => {
                            document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
                            btn.classList.add('active');
                            loadVideo(epData.url, `${activeItem.title || activeItem.name} - ${selectedSeason} ${epData.epName}`);
                        };
                        epGrid.appendChild(btn);
                        if (index === 0) btn.click();
                    });
                }
                seasonSelect.onchange = (e) => renderEpisodes(e.target.value);
                renderEpisodes(Object.keys(seasonsMap)[0] || 'S1');
            }
            langSelect.onchange = (e) => loadSeriesContent(e.target.value);
            loadSeriesContent(langKeys[0]);
        }

        function setupLiveTVPlayer(item, sidebar) {
            const groups = new Set();
            if (item.CN) Object.values(item.CN).forEach(ch => { if(ch.group) groups.add(ch.group); });

            let groupOptions = '<option value="all">Group: All</option>';
            groups.forEach(g => groupOptions += `<option value="${g}">${g}</option>`);

            sidebar.innerHTML = `
                <div class="filter-group"><label>Group Filter</label><select id="groupSelect" onchange="filterChannels()">${groupOptions}</select></div>
                <div id="channelList" class="channel-list"></div>
            `;
            window.currentChannels = item.CN || {};
            renderChannels('all');
        }

        function filterChannels() {
            renderChannels(document.getElementById('groupSelect').value);
        }

        function renderChannels(group) {
            const container = document.getElementById('channelList');
            container.innerHTML = '';
            let isFirst = true;

            Object.values(window.currentChannels).forEach(ch => {
                if (group === 'all' || ch.group === group) {
                    const div = document.createElement('div');
                    div.className = 'channel-item';
                    div.onclick = () => {
                        document.querySelectorAll('.channel-item').forEach(c => c.classList.remove('active'));
                        div.classList.add('active');
                        loadVideo(ch.url, ch.name);
                    };
                    div.innerHTML = `<img src="${ch.tvglogo}" alt="${ch.name}"><span>${ch.name}</span>`;
                    container.appendChild(div);
                    if (isFirst) { div.click(); isFirst = false; }
                }
            });
        }

        function destroyPlayers() {
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }
            if (artInstance) {
                artInstance.destroy();
                artInstance = null;
            }
        }

        function loadVideo(url, title) {
            const iframe = document.getElementById('iframePlayer');
            const artContainer = document.getElementById('artPlayerContainer');
            document.getElementById('videoTitle').innerText = title || '';

            destroyPlayers();

            if (!url) return;

            const cleanUrl = url.trim();
            const lowerUrl = cleanUrl.toLowerCase();

            // Cloudflare Worker ও Direct HLS Stream অটো-ডিটেকশন
            const isHlsStream = lowerUrl.includes('.m3u8') || lowerUrl.includes('workers.dev') || lowerUrl.includes('stream?id=');
            const isDirectVideo = lowerUrl.includes('.mp4') || lowerUrl.includes('.mkv');

            if (isHlsStream || isDirectVideo) {
                iframe.style.display = 'none';
                iframe.src = '';
                artContainer.style.display = 'block';

                artInstance = new Artplayer({
                    container: '#artPlayerContainer',
                    url: cleanUrl,
                    type: isHlsStream ? 'm3u8' : 'auto',
                    customType: {
                        m3u8: function (video, videoUrl) {
                            if (Hls.isSupported()) {
                                hlsInstance = new Hls({
                                    enableWorker: true,
                                    lowLatencyMode: true,
                                    backBufferLength: 90,
                                    xhrSetup: function (xhr, url) {
                                        xhr.withCredentials = false;
                                    }
                                });
                                hlsInstance.loadSource(videoUrl);
                                hlsInstance.attachMedia(video);
                                hlsInstance.on(Hls.Events.ERROR, function (event, data) {
                                    if (data.fatal) {
                                        switch (data.type) {
                                            case Hls.ErrorTypes.NETWORK_ERROR:
                                                hlsInstance.startLoad();
                                                break;
                                            case Hls.ErrorTypes.MEDIA_ERROR:
                                                hlsInstance.recoverMediaError();
                                                break;
                                            default:
                                                destroyPlayers();
                                                break;
                                        }
                                    }
                                });
                            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                                video.src = videoUrl;
                            }
                        },
                    },
                    autoplay: true,
                    pip: true,
                    screenshot: true,
                    fullscreen: true,
                    fullscreenWeb: true,
                    playbackRate: true,
                    aspectRatio: true,
                    theme: '#3b82f6',
                });

            } else {
                // External Embed / Iframe Link
                artContainer.style.display = 'none';
                iframe.style.display = 'block';
                iframe.src = cleanUrl;
            }
        }

        function closePlayerPage() {
            document.getElementById('player-view').style.display = 'none';
            document.getElementById('home-view').style.display = 'block';
            window.scrollTo(0, previousScrollPosition);
            document.getElementById('iframePlayer').src = '';
            destroyPlayers();
        }

        loadAllJSON();
    </script>
</body>
</html>
