name: Auto Update JSON Data

on:
  schedule:
    # প্রতি ১ ঘণ্টা পর পর স্বয়ংক্রিয়ভাবে চলবে (CRON Syntax)
    - cron: '0 * * * *'
  # ম্যানুয়ালি নিজের ইচ্ছেমত অ্যাকশন রান করার জন্য
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Fetch Latest Data / Update JSON File
        run: |
          # যদি কোনও প্রক্সি বা ক্লাউডফ্লেয়ার ওয়ার্কার ইউআরএল থেকে ডাটা রিফ্রেশ করতে চান:
          # curl -s "https://your-worker-name.subdomain.workers.dev" -o live-tv.json
          
          # ফাইলটিতে নতুন টাইমস্ট্যাম্প যুক্ত করে ফাইল আপডেট নিশ্চিত করা
          echo "Last updated at $(date)" > last_update.txt

      - name: Commit and Push Changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff-index --quiet HEAD || git commit -m "Auto update JSON and timestamps [cron]"
          git push
