<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream Portal Pro</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0f172a; color: #fff; padding: 15px; }

    header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #334155; }
    
    .search-bar { flex: 1; min-width: 200px; }
    .search-bar input { width: 100%; padding: 10px 15px; border-radius: 20px; border: 1px solid #334155; background: #1e293b; color: #fff; outline: none; }
    
    .nav-buttons, .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    
    button, select { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; padding: 8px 12px; border-radius: 6px; cursor: pointer; outline: none; font-size: 13px; }
    select { color: #38bdf8; font-weight: 600; }
    button:hover, button.active { background: #2563eb; color: #fff; border-color: #2563eb; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
    .card { background: #1e293b; border-radius: 8px; overflow: hidden; border: 1px solid #334155; cursor: pointer; transition: transform 0.2s; display: flex; flex-direction: column; }
    .card:hover { transform: translateY(-3px); border-color: #2563eb; }
    .card img { width: 100%; height: 220px; object-fit: cover; background: #000; }
    .card-details { padding: 8px 10px; }
    .card-title { font-size: 13px; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 4px; }
    .card-tag { font-size: 10px; background: #334155; padding: 2px 5px; border-radius: 4px; display: inline-block; text-transform: uppercase; margin-right: 3px; }
    .tag-lang { background: #2563eb; }

    #player-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15,23,42,0.95); z-index: 1000; padding: 15px; }
    .overlay-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .close-btn { background: #ef4444; color: white; border: none; padding: 8px 15px; font-weight: bold; border-radius: 5px; }

    .player-container { display: flex; gap: 15px; height: calc(100vh - 80px); background: #1e293b; padding: 15px; border-radius: 10px; }
    .video-box { flex: 3; background: #000; border-radius: 8px; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: contain; }
    .sidebar-box { flex: 1; background: #0f172a; padding: 15px; border-radius: 8px; overflow-y: auto; }
    
    .sidebar-title { font-size: 13px; color: #38bdf8; font-weight: bold; margin-bottom: 8px; }
    .sidebar-btn { width: 100%; text-align: left; padding: 10px; margin-bottom: 6px; background: #1e293b; color: #fff; border: 1px solid #334155; border-radius: 5px; }
    .sidebar-btn:hover, .sidebar-btn.active { background: #2563eb; }

    .btn-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 15px; }
    .btn-grid button { text-align: center; height: 35px; padding: 0; }

    @media (max-width: 768px) {
      .player-container { flex-direction: column; }
      .video-box { height: 240px; }
      .sidebar-box { height: 250px; }
    }
  </style>
</head>
<body>

  <header>
    <!-- ১. সার্চ বার -->
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="Search movies, series, tv..." oninput="filterGrid()">
    </div>
    
    <!-- ২. ক্যাটাগরি টাইপ বাটন -->
    <div class="nav-buttons">
      <button class="active" onclick="filterType('all', this)">All</button>
      <button onclick="filterType('anime', this)">Anime</button>
      <button onclick="filterType('movie', this)">Movie</button>
      <button onclick="filterType('tv-series', this)">TV Series</button>
      <button onclick="filterType('tv-channel', this)">Live TV</button>
    </div>

    <!-- ৩. ড্রপডাউন ফিল্টার (Country, Category, Language) -->
    <div class="filters">
      <select id="country-select" onchange="filterGrid()">
        <option value="all">Country: All</option>
      </select>
      <select id="category-select" onchange="filterGrid()">
        <option value="all">Category: All</option>
      </select>
      <select id="language-select" onchange="filterGrid()">
        <option value="all">Language: All</option>
      </select>
    </div>
  </header>

  <div class="grid" id="content-grid">Loading items...</div>

  <!-- প্লেয়ার ওভারলে -->
  <div id="player-overlay">
    <div class="overlay-header">
      <h3 id="current-stream-title" style="color: #38bdf8;">Stream Player</h3>
      <button class="close-btn" onclick="closePlayer()">✕ Close</button>
    </div>

    <div class="player-container">
      <div class="video-box">
        <video id="main-video" controls playsinline></video>
      </div>
      <div class="sidebar-box" id="sidebar-controls">
        <!-- ডায়নামিক পর্ব বা চ্যানেল লিস্ট -->
      </div>
    </div>
  </div>

  <script>
    // ⚠️ আপনার Cloudflare Worker-এর সঠিক URL দিন
    const JSON_URL = 'https://your-worker-name.workers.dev/data.json';

    let allData = [];
    let currentFilter = 'all';
    let hlsInstance = null;

    async function loadData() {
      try {
        const res = await fetch(JSON_URL);
        allData = await res.json();
        populateDropdowns();
        filterGrid();
      } catch (e) {
        document.getElementById('content-grid').innerHTML = '<p style="color:red; text-align:center; grid-column: 1/-1;">JSON লোড করতে সমস্যা হয়েছে। ক্লাউডফ্লেয়ার ওয়ার্কার চেক করুন।</p>';
      }
    }

    // Country, Category, Language ড্রপডাউন পপুলেট করার ফাংশন
    function populateDropdowns() {
      const countries = [...new Set(allData.map(item => item.country).filter(Boolean))];
      const categories = [...new Set(allData.map(item => item.category).filter(Boolean))];
      const languages = [...new Set(allData.map(item => item.language).filter(Boolean))];

      const countrySel = document.getElementById('country-select');
      countrySel.innerHTML = '<option value="all">Country: All</option>';
      countries.forEach(c => countrySel.innerHTML += `<option value="${c}">Country: ${c}</option>`);

      const catSel = document.getElementById('category-select');
      catSel.innerHTML = '<option value="all">Category: All</option>';
      categories.forEach(c => catSel.innerHTML += `<option value="${c}">Category: ${c}</option>`);

      const langSel = document.getElementById('language-select');
      langSel.innerHTML = '<option value="all">Language: All</option>';
      languages.forEach(l => langSel.innerHTML += `<option value="${l}">Language: ${l}</option>`);
    }

    function filterType(type, btn) {
      currentFilter = type;
      document.querySelectorAll('.nav-buttons button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterGrid();
    }

    // মাল্টি-ফিল্টারিং লজিক (Search + Type + Country + Category + Language)
    function filterGrid() {
      const searchQuery = document.getElementById('search-input').value.toLowerCase();
      const selectedCountry = document.getElementById('country-select').value;
      const selectedCategory = document.getElementById('category-select').value;
      const selectedLanguage = document.getElementById('language-select').value;

      let filtered = allData.filter(item => {
        let matchType = (currentFilter === 'all') ? true : (item.type === currentFilter);
        let matchCountry = (selectedCountry === 'all') ? true : (item.country === selectedCountry);
        let matchCategory = (selectedCategory === 'all') ? true : (item.category === selectedCategory);
        let matchLanguage = (selectedLanguage === 'all') ? true : (item.language === selectedLanguage);

        let title = item.name || item.country || '';
        let matchSearch = title.toLowerCase().includes(searchQuery);

        return matchType && matchCountry && matchCategory && matchLanguage && matchSearch;
      });

      renderGrid(filtered);
    }

    function renderGrid(data) {
      const grid = document.getElementById('content-grid');
      if (!data.length) { 
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center;">কোনো কনটেন্ট পাওয়া যায়নি।</p>'; 
        return; 
      }

      grid.innerHTML = data.map((item, idx) => `
        <div class="card" onclick="openMedia(${allData.indexOf(item)})">
          <img src="${item.image || 'https://via.placeholder.com/160x220?text=No+Cover'}" alt="">
          <div class="card-details">
            <div class="card-title">${item.name || item.country || 'Untitled'}</div>
            <span class="card-tag">${item.type}</span>
            ${item.language ? `<span class="card-tag tag-lang">${item.language}</span>` : ''}
          </div>
        </div>
      `).join('');
    }

    function openMedia(index) {
      const item = allData[index];
      document.getElementById('player-overlay').style.display = 'block';
      document.getElementById('current-stream-title').innerText = item.name || item.country || 'Player';
      
      const sidebar = document.getElementById('sidebar-controls');
      sidebar.innerHTML = '';

      if (item.type === 'movie' && item.movielink) {
        sidebar.innerHTML = `<div class="sidebar-title">Movie Quality / Link</div>
                             <button class="sidebar-btn active" onclick="playVideo('${item.movielink}')">Play Movie</button>`;
        playVideo(item.movielink);
      } 
      else if ((item.type === 'anime' || item.type === 'tv-series') && item.episodes) {
        const keys = Object.keys(item.episodes);
        sidebar.innerHTML = `<div class="sidebar-title">Episodes List</div>
                             <div class="btn-grid">` + 
                             keys.map(k => `<button class="sidebar-btn" onclick="playVideo('${item.episodes[k]}')">${k}</button>`).join('') +
                             `</div>`;
        if (keys.length > 0) playVideo(item.episodes[keys[0]]);
      } 
      else if (item.type === 'tv-channel' && item.CN) {
        const keys = Object.keys(item.CN);
        sidebar.innerHTML = `<div class="sidebar-title">Live Channels</div>` + 
                             keys.map(k => `<button class="sidebar-btn" onclick="playVideo('${item.CN[k].url}')">${item.CN[k].name}</button>`).join('');
        if (keys.length > 0) playVideo(item.CN[keys[0]].url);
      }
    }

    function playVideo(url) {
      const video = document.getElementById('main-video');
      
      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }

      video.pause();
      video.removeAttribute('src');
      video.load();

      if (url.includes('.m3u8')) {
        if (Hls.isSupported()) {
          hlsInstance = new Hls({ enableWorker: true });
          hlsInstance.loadSource(url);
          hlsInstance.attachMedia(video);
          hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => video.play());
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = url;
          video.play();
        }
      } else {
        // MP4, MKV, WebM সরাসরি প্লে হবে
        video.src = url;
        video.play().catch(e => console.log('Playback error:', e));
      }
    }

    function closePlayer() {
      document.getElementById('player-overlay').style.display = 'none';
      const video = document.getElementById('main-video');
      if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
      video.pause();
      video.removeAttribute('src');
      video.load();
    }

    loadData();
  </script>
</body>
</html>
