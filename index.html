<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STREMXBD Streaming App - Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b1120; color: #ffffff; padding: 20px; }
        
        /* Admin/Overlay */
        #admin-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 17, 32, 0.99); z-index: 20000; display: flex; align-items: center; justify-content: center; }
        .admin-box { background: #161e2e; padding: 30px; border-radius: 12px; border: 1.5px solid #3b82f6; text-align: center; max-width: 400px; width: 90%; }
        .admin-input { width: 100%; padding: 12px; margin: 15px 0; background: #0f172a; border: 1px solid #1f2937; border-radius: 6px; color: #fff; outline: none; }
        
        /* Layout */
        .navbar { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; padding: 10px 0; margin-bottom: 25px; position: relative; }
        .search-box { flex-grow: 1; min-width: 200px; background-color: #111827; border: 1px solid #1f2937; padding: 10px 18px; border-radius: 20px; color: #fff; font-size: 14px; outline: none; }
        .nav-link { background: none; border: none; color: #94a3b8; font-size: 15px; cursor: pointer; padding: 4px 8px; }
        .nav-link.active { color: #3b82f6; font-weight: 600; }
        .select-link { background: transparent; border: none; color: #3b82f6; font-size: 14px; font-weight: 600; cursor: pointer; outline: none; }

        /* Profile */
        .profile-container { position: relative; margin-left: auto; z-index: 1000; }
        .profile-icon { width: 38px; height: 38px; border-radius: 50%; background-color: #1f2937; border: 2px solid #fbbf24; cursor: pointer; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .profile-icon img { width: 100%; height: 100%; object-fit: cover; }
        .user-dropdown { position: absolute; top: 45px; right: 0; background-color: #161e2e; border: 1px solid #1f2937; border-radius: 8px; width: 220px; display: none; flex-direction: column; box-shadow: 0 10px 15px rgba(0,0,0,0.5); overflow: hidden; }
        .dropdown-item { padding: 12px 16px; font-size: 14px; color: #fff; cursor: pointer; border-bottom: 1px solid #1f2937; }
        .dropdown-item:hover { background-color: #1f2937; }

        /* Media */
        .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        .card { background-color: #161e2e; border-radius: 6px; overflow: hidden; cursor: pointer; border: 1.5px solid #10b981; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); border-color: #3b82f6; }
        .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        .card-info { padding: 6px 8px; text-align: center; }
        .card-title { font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Payment */
        #payment-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 10005; overflow-y: auto; padding: 20px; }
        .payment-box { background: #161e2e; max-width: 500px; margin: 30px auto; padding: 25px; border-radius: 12px; border: 2px solid #fbbf24; }

        /* Player */
        #player-view { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0b1120; z-index: 9999; padding: 20px; overflow-y: auto; }
        .player-container { display: flex; gap: 20px; max-width: 1600px; margin: 0 auto; background: #0f172a; padding: 20px; border-radius: 12px; }
        .video-wrapper { width: 100%; aspect-ratio: 16 / 9; background-color: #000; border-radius: 8px; overflow: hidden; position: relative; }
        .player-sidebar { width: 300px; background: #161e2e; padding: 15px; border-radius: 8px; max-height: 80vh; overflow-y: auto; }
        @media (max-width: 1024px) { .player-container { flex-direction: column; } .player-sidebar { width: 100%; } }
    </style>
</head>
<body>

    <div id="admin-overlay">
        <div class="admin-box">
            <h2 style="color: #3b82f6;">STREMXBD PRO</h2>
            <input type="text" id="adminCodeInput" class="admin-input" placeholder="Admin Code (Optional)">
            <button onclick="checkAdminCode()" style="background:#3b82f6; color:#fff; border:none; padding:12px; width:100%; border-radius:6px; font-weight:bold; cursor:pointer;">ENTER APP</button>
            <p style="margin-top:15px; font-size:12px; color:#64748b; cursor:pointer;" onclick="closeAdminOverlay()">SKIP TO FREE VERSION</p>
        </div>
    </div>

    <div id="home-view">
        <div class="navbar">
            <input type="text" id="searchInput" class="search-box" placeholder="Search title..." oninput="applyFilters()">
            <button class="nav-link active" onclick="filterTab('All', this)">All</button>
            <button class="nav-link" onclick="filterTab('Anime', this)">Anime</button>
            <button class="nav-link" onclick="filterTab('Movie', this)">Movie</button>
            <button class="nav-link" onclick="filterTab('TV Series', this)">Series</button>
            <button class="nav-link" onclick="filterTab('Live TV', this)">Live TV</button>

            <select id="countrySelect" class="select-link" onchange="applyFilters()"><option value="all">Country: All</option></select>
            <select id="languageSelect" class="select-link" onchange="applyFilters()"><option value="all">Language: All</option></select>

            <div class="profile-container">
                <div class="profile-icon" onclick="toggleDropdown(event)">
                    <svg id="def-icon" style="width:24px; height:24px; fill:#94a3b8" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
                </div>
                <div class="user-dropdown" id="userDropdown">
                    <div class="dropdown-item" id="status-tag" style="color: #fbbf24; font-weight: bold;">Free User</div>
                    <div class="dropdown-item" onclick="openPayment()" style="background: #fbbf24; color: #000; font-weight: bold;">💎 Buy Premium</div>
                    <div class="dropdown-item" onclick="handleAuth()" id="loginBtn">Google Login</div>
                    <div class="dropdown-item" onclick="logout()" id="logoutBtn" style="display:none; color: #ef4444;">Logout</div>
                </div>
            </div>
        </div>
        <div id="main-content" class="media-grid">Loading...</div>
    </div>

    <div id="payment-modal">
        <div class="payment-box">
            <h2 style="text-align: center; color: #fbbf24;">💎 UPGRADE</h2>
            <p style="text-align: center; font-size: 14px; margin-top:10px;">Send money to: <b>01795226250</b></p>
            <div style="margin: 20px 0; background:#0f172a; padding:15px; border-radius:8px;">
                <p>1 Month - 50 TK</p><p>2 Month - 80 TK</p><p>3 Month - 100 TK</p><p>1 Year - 250 TK</p>
            </div>
            <button onclick="closePayment()" style="width:100%; padding:10px; background:#ef4444; border:none; color:#fff; border-radius:6px; cursor:pointer;">CLOSE</button>
        </div>
    </div>

    <div id="player-view">
        <div class="player-container">
            <div style="flex: 1;">
                <h2 id="videoTitle" style="margin-bottom: 15px; color: #3b82f6;"></h2>
                <div class="video-wrapper">
                    <div id="art" style="width:100%; height:100%;"></div>
                    <iframe id="ifr" style="width:100%; height:100%; display:none;" allowfullscreen></iframe>
                </div>
                <button onclick="closePlayer()" style="margin-top:20px; padding:10px 20px; background:#ef4444; border:none; color:#fff; border-radius:6px; cursor:pointer;">CLOSE PLAYER</button>
            </div>
            <div id="sideBar" class="player-sidebar"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCYpyD5bDR2PCVvZR0HHnb410EJWRuZITg", authDomain: "anime-stream-bd.firebaseapp.com", projectId: "anime-stream-bd", storageBucket: "anime-stream-bd.firebasestorage.app", messagingSenderId: "664804369599", appId: "1:664804369599:web:c2ce67b0e0e4a59050520a" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();

        let isPremium = localStorage.getItem('isPremium') === 'true', playbackTimer = null, loadedData = {}, currentTab = 'All';

        function repairJSON(txt) {
            try { return JSON.parse(txt); }
            catch(e) { try { let c = txt.replace(/"\s*\n*\r*\s*"/g, '","').replace(/([0-9]|"|true|false|null)\s*\n*\r*\s*"([^"]+)":/g, '$1,"$2":').replace(/,\s*([\]}])/g, '$1'); return JSON.parse(c); } catch(r) { return new Function("return " + txt)(); } }
        }

        async function loadAll() {
            const sources = [
                { name: "Anime", url: "https://raw.githubusercontent.com/Sobujaka/STREMXBD/refs/heads/main/anime.json" },
                { name: "Movie", url: "https://raw.githubusercontent.com/Sobujaka/STREMXBD/refs/heads/main/movies.json" },
                { name: "TV Series", url: "https://raw.githubusercontent.com/Sobujaka/STREMXBD/refs/heads/main/tv-sriese.json" },
                { name: "Live TV", url: "https://raw.githubusercontent.com/Sobujaka/STREMXBD/refs/heads/main/live-tv.json" }
            ];
            for(let s of sources) {
                try { const r = await fetch(s.url); const t = await r.text(); loadedData[s.name] = repairJSON(t); } catch(e) {}
            }
            populateFilters(); applyFilters();
        }

        function populateFilters() {
            const countries = new Set();
            Object.values(loadedData).flat().forEach(i => { if(i && i.country) countries.add(i.country); });
            const sel = document.getElementById('countrySelect');
            Array.from(countries).sort().forEach(c => sel.innerHTML += `<option value="${c.toLowerCase()}">${c}</option>`);
        }

        function applyFilters() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const country = document.getElementById('countrySelect').value;
            let list = (currentTab === 'All') ? [...(loadedData['Anime']||[]), ...(loadedData['Movie']||[]), ...(loadedData['TV Series']||[])] : (loadedData[currentTab]||[]);
            let filtered = list.filter(i => {
                if(!i) return false;
                const title = (i.name || i.title || i.country || '').toLowerCase();
                return title.includes(search) && (country === 'all' || (i.country && i.country.toLowerCase() === country));
            });
            renderGrid(filtered);
        }

        function renderGrid(items) {
            const container = document.getElementById('main-content');
            container.innerHTML = '';
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<img src="${item.image}" loading="lazy"><div class="card-info"><div class="card-title">${item.name||item.title||item.country}</div></div>`;
                card.onclick = () => openPlayer(item);
                container.appendChild(card);
            });
        }

        function openPlayer(item) {
            if ((currentTab === 'Live TV' || item.type === 'tv-channel') && !isPremium) { alert('Live TV needs Premium!'); openPayment(); return; }
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('player-view').style.display = 'block';
            document.getElementById('videoTitle').innerText = item.name || item.title || item.country;
            
            const url = item["Movie link"] || item.url || (item.episodes ? Object.values(item.episodes)[0] : '');
            const art = document.getElementById('art'), ifr = document.getElementById('ifr');

            if (url.includes('.m3u8') || url.includes('.mp4')) {
                ifr.style.display = 'none'; art.style.display = 'block';
                new Artplayer({ container: '#art', url: url, autoplay: true, fullscreen: true });
            } else {
                art.style.display = 'none'; ifr.style.display = 'block'; ifr.src = url;
            }

            if (!isPremium) { playbackTimer = setTimeout(() => { closePlayer(); alert('5 Min Limit Reached! Buy Premium.'); openPayment(); }, 5 * 60 * 1000); }
        }

        function closePlayer() { if(playbackTimer) clearTimeout(playbackTimer); document.getElementById('player-view').style.display='none'; document.getElementById('home-view').style.display='block'; document.getElementById('ifr').src=''; }
        function checkAdminCode() { if(document.getElementById('adminCodeInput').value === 'jahangir alam sobuj') { isPremium = true; localStorage.setItem('isPremium', 'true'); alert('Admin Success!'); } closeAdminOverlay(); }
        function closeAdminOverlay() { document.getElementById('admin-overlay').style.display = 'none'; updateUI(); }
        function updateUI() { document.getElementById('status-tag').innerText = isPremium ? "Premium 💎" : "Free User"; }
        function openPayment() { document.getElementById('payment-modal').style.display = 'block'; }
        function closePayment() { document.getElementById('payment-modal').style.display = 'none'; }
        function filterTab(t, btn) { document.querySelectorAll('.nav-link').forEach(b => b.classList.remove('active')); btn.classList.add('active'); currentTab = t; applyFilters(); }
        function toggleDropdown(e) { e.stopPropagation(); document.getElementById('userDropdown').classList.toggle('show'); }
        window.onclick = () => document.getElementById('userDropdown').classList.remove('show');
        function handleAuth() { auth.signInWithPopup(provider); }
        function logout() { auth.signOut(); }
        auth.onAuthStateChanged(user => {
            if(user) { document.getElementById('loginBtn').style.display='none'; document.getElementById('logoutBtn').style.display='block'; document.getElementById('profileIcon').innerHTML=`<img src="${user.photoURL}">`; }
            else { document.getElementById('loginBtn').style.display='block'; document.getElementById('logoutBtn').style.display='none'; document.getElementById('profileIcon').innerHTML=`<svg style="width:24px; height:24px; fill:#94a3b8" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>`; }
        });
        loadAll();
    </script>
</body>
</html>
