name: Update Secure Data JSON

on:
  # ১. গিটহাব থেকে ম্যানুয়ালি ক্লিক করে রান করার জন্য
  workflow_dispatch:

  # ২. নির্দিষ্ট সময় পর পর অটোমেটিক রান হওয়ার জন্য (UTC Time অনুযায়ী দিনে ৪ বার)
  schedule:
    - cron: '0 0,6,12,18 * * *'

jobs:
  update-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Fetch Latest Tokenized Data from Cloudflare
        run: |
          curl -s "https://spring-voice-2488.jahangir339932.workers.dev/data.json" -o data.json

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Manual/Auto update tokenized streams" && git push)
