name: Update tv.json Data

on:
  schedule:
    # প্রতি ১ ঘণ্টা পর পর স্বয়ংক্রিয়ভাবে চলবে
    - cron: '0 * * * *'
  # GitHub-এর Actions ট্যাব থেকে 'Run workflow' বাটনে চাপ দিয়ে ইচ্ছামতো রান করার জন্য
  workflow_dispatch:

jobs:
  update-file:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch and Update tv.json
        run: |
          # আপনার প্রক্সি বা মূল সোর্স লিঙ্ক থেকে tv.json ফাইল আপডেট করার কমান্ড
          # প্রয়োজন অনুযায়ী নিচের curl লিঙ্কটি পরিবর্তন করে নিতে পারেন
          curl -s "https://raw.githubusercontent.com/Sobujaka/STREMXBD/refs/heads/main/live-tv.json" -o tv.json

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tv.json
          git diff-index --quiet HEAD || git commit -m "Updated tv.json file [Auto/Manual]"
          git push
