<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STREMXBD Streaming App</title>
    <!-- HLS.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- Artplayer.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b1120;
            color: #ffffff;
            padding: 20px;
        }

        #home-view, #history-fav-view { display: block; }
        #history-fav-view { display: none; }

        .navbar {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            padding: 10px 0;
            margin-bottom: 25px;
            position: relative;
        }

        .profile-container {
            position: relative;
            margin-left: auto;
            z-index: 1000;
        }

        .profile-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background-color: #1f2937;
            border: 2px solid #3b82f6;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: transform 0.2s;
        }

        .profile-icon:hover { transform: scale(1.05); }

        .profile-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-icon svg {
            width: 20px;
            height: 20px;
            fill: #94a3b8;
        }

        .user-dropdown {
            position: absolute;
            top: 45px;
            right: 0;
            background-color: #161e2e;
            border: 1px solid #1f2937;
            border-radius: 8px;
            width: 200px;
            display: none;
            flex-direction: column;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .user-dropdown.show { display: flex; }

        .dropdown-item {
            padding: 12px 16px;
            font-size: 14px;
            color: #f8fafc;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .dropdown-item:hover { background-color: #1f2937; }
        .dropdown-item.logout { color: #ef4444; border-top: 1px solid #1f2937; }

        .fav-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            cursor: pointer;
            border: none;
            transition: transform 0.2s;
        }
        .fav-btn:hover { transform: scale(1.1); }
        .fav-btn svg { width: 16px; height: 16px; fill: #94a3b8; }
        .fav-btn.active svg { fill: #ef4444; }

        .view-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            border-bottom: 1px solid #1f2937;
            padding-bottom: 10px;
        }

        .view-title { font-size: 22px; font-weight: 600; color: #3b82f6; }

        .empty-state {
            text-align: center;
            padding: 50px;
            color: #94a3b8;
        }

        .search-box {
            flex-grow: 1;
            min-width: 200px;
            background-color: #111827;
            border: 1px solid #1f2937;
            padding: 10px 18px;
            border-radius: 20px;
            color: #94a3b8;
            font-size: 14px;
            outline: none;
        }

        .nav-link {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            padding: 4px 8px;
        }

        .nav-link.active { color: #3b82f6; font-weight: 600; }

        .select-link {
            background: transparent;
            border: none;
            color: #3b82f6;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
        }

        .select-link option { background-color: #0f172a; color: #ffffff; }

        .media-grid {
            display: grid;
            grid-template-columns: repeat(8, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 30px;
        }

        .card {
            background-color: #161e2e;
            border-radius: 6px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            border: 1.5px solid #10b981;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: #059669;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .card-image-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 2 / 3;
            background-color: #0f172a;
        }

        .card-image-wrapper.square-box { aspect-ratio: 1 / 1; }

        .card img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .card-info { padding: 6px 8px; }

        .card-title {
            font-size: 11px;
            font-weight: 600;
            color: #f8fafc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-transform: capitalize;
        }

        #player-view {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #0b1120;
            z-index: 9999;
            padding: 20px;
            overflow-y: auto;
        }

        .player-container {
            display: flex;
            gap: 20px;
            max-width: 1600px;
            margin: 0 auto;
            background: #0f172a;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #1f2937;
        }

        .player-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 0;
        }

        .player-title {
            font-size: 20px;
            font-weight: 600;
            color: #3b82f6;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-bottom: 2px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .server-buttons {
            display: inline-flex;
            gap: 8px;
            vertical-align: middle;
        }

        .server-btn {
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 4px 10px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .server-btn:hover, .server-btn.active {
            background: #3b82f6;
            color: #fff;
            border-color: #3b82f6;
        }

        .video-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .drive-icon-blocker {
            position: absolute;
            top: 0;
            right: 0;
            width: 60px;
            height: 60px;
            z-index: 10;
            background: transparent;
            pointer-events: auto;
        }

        .video-wrapper iframe, .artplayer-app {
            width: 100%;
            height: 100%;
            border: none;
        }

        .player-sidebar-wrapper {
            width: 300px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .back-btn {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            width: 100%;
            text-align: center;
            align-self: flex-end;
            transition: background 0.2s;
        }

        .back-btn:hover { background: #dc2626; }

        .player-sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #161e2e;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #1f2937;
            max-height: 78vh;
            overflow-y: auto;
        }

        .filter-group { display: flex; flex-direction: column; gap: 5px; }
        .filter-group label { font-size: 12px; color: #94a3b8; }
        .filter-group select {
            background: #0f172a;
            color: #fff;
            border: 1px solid #1f2937;
            padding: 8px;
            border-radius: 5px;
            outline: none;
        }

        .episodes-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .ep-btn {
            background: #0f172a;
            border: 1px solid #1f2937;
            color: #fff;
            padding: 8px 0;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
        }

        .ep-btn:hover, .ep-btn.active { background: #3b82f6; border-color: #3b82f6; }

        .channel-list { display: flex; flex-direction: column; gap: 8px; }

        .channel-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #0f172a;
            padding: 8px;
            border-radius: 5px;
            cursor: pointer;
            border: 1px solid #1f2937;
        }

        .channel-item:hover, .channel-item.active { border-color: #3b82f6; background: #1e293b; }
        .channel-item img { width: 35px; height: 35px; object-fit: contain; border-radius: 4px; }
        .channel-item span { font-size: 13px; font-weight: 500; }

        #adblock-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: rgba(11, 17, 32, 0.98);
            z-index: 999999;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .adblock-box {
            background-color: #161e2e;
            border: 2px solid #ef4444;
            padding: 30px;
            border-radius: 12px;
            max-width: 450px;
        }

        .adblock-box h2 { color: #ef4444; font-size: 22px; margin-bottom: 12px; }
        .adblock-box p { color: #94a3b8; font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
        .adblock-box button { background: #3b82f6; color: #fff; border: none; padding: 10px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; }

        @media (max-width: 1024px) {
            .player-container { flex-direction: column; }
            .player-sidebar-wrapper { width: 100%; }
            .media-grid { grid-template-columns: repeat(4, 1fr); }
        }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .media-grid { grid-template-columns: repeat(2, 1fr); }
            #player-view { padding: 0; background-color: #0f172a; }
            .player-container { border-radius: 0; border: none; padding: 10px; gap: 12px; }
            .player-title { font-size: 15px; }
            .video-wrapper { border-radius: 6px; box-shadow: none; }
            .player-sidebar { max-height: none; padding: 10px; }
            .episodes-grid { grid-template-columns: repeat(4, 1fr); }
        }
    </style>
</head>
<body>

    <div id="adblock-overlay">
        <div class="adblock-box">
            <h2>AdBlocker Detected!</h2>
            <p>আপনার ব্রাউজারে অ্যাড ব্লকার চালু রয়েছে। দয়া করে অ্যাড ব্লকার ডিজেবল করুন এবং রিফ্রেশ দিন।</p>
            <button onclick="window.location.reload()">Refresh Page</button>
        </div>
    </div>

    <div id="home-view">
        <div class="navbar">
            <input type="text" id="searchInput" class="search-box" placeholder="Search title..." oninput="applyFilters()">
            <button class="nav-link active" data-tab="All" onclick="filterTab('All', this)">All</button>
            <button class="nav-link" data-tab="Anime" onclick="filterTab('Anime', this)">Anime</button>
            <button class="nav-link" data-tab="Movie" onclick="filterTab('Movie', this)">Movie</button>
            <button class="nav-link" data-tab="TV Series" onclick="filterTab('TV Series', this)">TV Series</button>
            <button class="nav-link" data-tab="Live TV" onclick="filterTab('Live TV', this)">Live TV</button>

            <select id="countrySelect" class="select-link" onchange="applyFilters()"><option value="all">Country: All</option></select>
            <select id="categorySelect" class="select-link" onchange="applyFilters()"><option value="all">Category: All</option></select>
            <select id="languageSelect" class="select-link" onchange="applyFilters()"><option value="all">Language: All</option></select>

            <div class="profile-container">
                <div class="profile-icon" id="profileIcon" onclick="toggleDropdown(event)">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
                </div>
                <div class="user-dropdown" id="userDropdown">
                    <div id="userInfoDisplay" style="padding: 12px 16px; border-bottom: 1px solid #1f2937; display: none;">
                        <div id="dropdownUserName" style="font-weight: 600; font-size: 14px;"></div>
                        <div id="dropdownUserEmail" style="font-size: 12px; color: #94a3b8;"></div>
                    </div>
                    <div class="dropdown-item" onclick="showFavorites()">
                        <svg style="width:16px; height:16px; fill:#3b82f6" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                        Favorites
                    </div>
                    <div class="dropdown-item" onclick="showHistory()">
                        <svg style="width:16px; height:16px; fill:#10b981" viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
                        History
                    </div>
                    <div class="dropdown-item" id="dropdownLoginBtn" onclick="handleAuth()">
                        Login with Google
                    </div>
                    <div class="dropdown-item logout" id="dropdownLogoutBtn" onclick="logout()" style="display: none;">
                        Logout
                    </div>
                </div>
            </div>
        </div>
        <div id="main-content"></div>
    </div>

    <div id="history-fav-view">
        <div class="view-header">
            <h2 id="historyFavTitle" class="view-title">Favorites</h2>
            <button class="nav-link" style="color: #ef4444;" onclick="closeHistoryFavView()">Close ✕</button>
        </div>
        <div id="history-fav-content"></div>
    </div>

    <div id="player-view">
        <div class="player-container">
            <div class="player-main">
                <h2 id="videoTitle" class="player-title"></h2>
                <div class="video-wrapper" id="videoContainer">
                    <div class="drive-icon-blocker"></div>
                    <iframe id="iframePlayer" src="" allowfullscreen style="display:none;"></iframe>
                    <div id="artPlayerContainer" class="artplayer-app" style="display:none;"></div>
                </div>
            </div>

            <div class="player-sidebar-wrapper">
                <button class="back-btn" onclick="closePlayerPage()">Back to Home →</button>
                <div id="playerSidebar" class="player-sidebar"></div>
            </div>
        </div>
    </div>

    <script>
        // --- Firebase Configuration ---
        const firebaseConfig = {
            apiKey: "AIzaSyCYpyD5bDR2PCVvZR0HHnb410EJWRuZITg",
            authDomain: "anime-stream-bd.firebaseapp.com",
            databaseURL: "https://anime-stream-bd-default-rtdb.firebaseio.com",
            projectId: "anime-stream-bd",
            storageBucket: "anime-stream-bd.firebasestorage.app",
            messagingSenderId: "664804369599",
            appId: "1:664804369599:web:c2ce67b0e0e4a59050520a"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();

        function handleAuth() {
            auth.signInWithPopup(provider).then((result) => {
                console.log("Logged in:", result.user);
            }).catch((error) => {
                console.error("Login failed:", error.message);
                alert("Google Login failed: " + error.message);
            });
        }

        function logout() {
            auth.signOut();
        }

        auth.onAuthStateChanged((user) => {
            const loginBtn = document.getElementById('dropdownLoginBtn');
            const logoutBtn = document.getElementById('dropdownLogoutBtn');
            const userInfo = document.getElementById('userInfoDisplay');
            const icon = document.getElementById('profileIcon');

            if (user) {
                loginBtn.style.display = 'none';
                logoutBtn.style.display = 'flex';
                userInfo.style.display = 'block';
                document.getElementById('dropdownUserName').innerText = user.displayName;
                document.getElementById('dropdownUserEmail').innerText = user.email;
                icon.innerHTML = `<img src="${user.photoURL}" alt="Profile">`;
            } else {
                loginBtn.style.display = 'flex';
                logoutBtn.style.display = 'none';
                userInfo.style.display = 'none';
                icon.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>`;
            }
        });

        function toggleDropdown(e) {
            e.stopPropagation();
            document.getElementById('userDropdown').classList.toggle('show');
        }

        window.onclick = function(event) {
            if (!event.target.closest('.profile-container')) {
                document.getElementById('userDropdown').classList.remove('show');
            }
        }

        // --- History & Favorites Logic ---
        let watchHistory = JSON.parse(localStorage.getItem('stremxbd_history') || '[]');
        let favorites = JSON.parse(localStorage.getItem('stremxbd_favorites') || '[]');

        function saveHistory() { localStorage.setItem('stremxbd_history', JSON.stringify(watchHistory)); }
        function saveFavorites() { localStorage.setItem('stremxbd_favorites', JSON.stringify(favorites)); }

        function addToHistory(item) {
            const newItem = { ...item };
            delete newItem.languagesMap;
            watchHistory = watchHistory.filter(h => (h.title || h.name) !== (newItem.title || newItem.name));
            watchHistory.unshift(newItem);
            if (watchHistory.length > 50) watchHistory.pop();
            saveHistory();
        }

        function toggleFavorite(e, item) {
            e.stopPropagation();
            const title = item.title || item.name;
            const index = favorites.findIndex(f => (f.title || f.name) === title);
            if (index > -1) {
                favorites.splice(index, 1);
                e.currentTarget.classList.remove('active');
            } else {
                const favItem = { ...item };
                delete favItem.languagesMap;
                favorites.push(favItem);
                e.currentTarget.classList.add('active');
            }
            saveFavorites();
        }

        function isFavorite(title) {
            return favorites.some(f => (f.title || f.name) === title);
        }

        function showFavorites() {
            document.getElementById('userDropdown').classList.remove('show');
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('player-view').style.display = 'none';
            document.getElementById('history-fav-view').style.display = 'block';
            document.getElementById('historyFavTitle').innerText = 'My Favorites';
            renderSpecialGrid(favorites, 'history-fav-content');
        }

        function showHistory() {
            document.getElementById('userDropdown').classList.remove('show');
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('player-view').style.display = 'none';
            document.getElementById('history-fav-view').style.display = 'block';
            document.getElementById('historyFavTitle').innerText = 'Watch History';
            renderSpecialGrid(watchHistory, 'history-fav-content');
        }

        function closeHistoryFavView() {
            document.getElementById('history-fav-view').style.display = 'none';
            document.getElementById('home-view').style.display = 'block';
        }

        function renderSpecialGrid(items, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            if (items.length === 0) {
                container.innerHTML = '<div class="empty-state">No items found here.</div>';
                return;
            }
            const grid = document.createElement('div');
            grid.className = 'media-grid';
            items.forEach(item => {
                const isSquare = item.type === "tv-channel";
                const displayTitle = isSquare ? item.country : (item.title || item.name || "Untitled");
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => {
                    closeHistoryFavView();
                    openPlayerPage(item);
                };

                const favBtn = document.createElement('button');
                favBtn.className = 'fav-btn active';
                favBtn.onclick = (e) => {
                    toggleFavorite(e, item);
                    card.remove();
                    if (grid.children.length === 0) container.innerHTML = '<div class="empty-state">No items found here.</div>';
                };
                favBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;

                card.appendChild(favBtn);
                card.innerHTML += `
                    <div class="card-image-wrapper ${isSquare ? 'square-box' : ''}">
                        <img src="${item.image || ''}" alt="${displayTitle}">
                    </div>
                    <div class="card-info">
                        <div class="card-title">${displayTitle}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
            container.appendChild(grid);
        }

        async function checkAdBlocker() {
            const googleAdUrl = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js';
            try {
                await fetch(googleAdUrl, { method: 'HEAD', mode: 'no-cors' });
                const fakeAd = document.createElement('div');

        function repairAndParseJSON(jsonText) {
            try {
                return JSON.parse(jsonText);
            } catch (e) {
                try {
                    let cleaned = jsonText.replace(/"\s*\n*\r*\s*"/g, '","')
                                         .replace(/([0-9]|"|true|false|null)\s*\n*\r*\s*"([^"]+)":/g, '$1,"$2":')
                                         .replace(/,\s*([\]}])/g, '$1');
                    return JSON.parse(cleaned);
                } catch (repairError) {
                    return new Function("return " + jsonText)();
                }
            }
        }

        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        async function loadAllJSON() {
            const fetchPromises = jsonSources.map(source =>
                fetch(source.url)
                    .then(res => res.text())
                    .then(textData => ({ category: source.name, data: repairAndParseJSON(textData) }))
                    .catch(err => ({ category: source.name, data: [] }))
            );

            const results = await Promise.allSettled(fetchPromises);
            results.forEach(result => {
                if (result.status === 'fulfilled' && result.value.data) {
                    loadedData[result.value.category] = result.value.data;
                }
            });

            restoreState();
            populateDropdowns();
            applyFilters();
            checkAndRestorePlayerFromHash();
        }

        function restoreState() {
            const savedTab = localStorage.getItem('selectedTab');
            if (savedTab) {
                currentTab = savedTab;
                document.querySelectorAll('.nav-link').forEach(btn => {
                    if (btn.getAttribute('data-tab') === currentTab) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });
            }

            const savedSearch = localStorage.getItem('searchVal');
            if (savedSearch) document.getElementById('searchInput').value = savedSearch;

        function capitalizeText(str) {
            if (!str) return '';
            return str.toLowerCase().split(' ').map(word => {
                if (word.includes('&')) {
                    return word.split('&').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join('&');
                }
                return word.charAt(0).toUpperCase() + word.slice(1);
            }).join(' ');
        }

        function populateDropdowns() {
            const countries = new Map(), categories = new Map(), languages = new Map();
            ['Anime', 'Movie', 'TV Series'].forEach(cat => {
                if (loadedData[cat] && Array.isArray(loadedData[cat])) {
                    loadedData[cat].forEach(item => {
                        if (item.country) {
                            const raw = item.country.trim();
                            const key = raw.toLowerCase();
                            if (!countries.has(key)) countries.set(key, capitalizeText(raw));
                        }

                        if (item.category) {
                            const catList = item.category.split(/[,/]+/).map(c => c.trim());
                            catList.forEach(c => {
                                if (c) {
                                    const key = c.toLowerCase();
                                    if (!categories.has(key)) categories.set(key, capitalizeText(c));
                                }
                            });
                        }

                        if (item.language) {
                            const raw = item.language.trim();
                            const key = raw.toLowerCase();
                            if (!languages.has(key)) languages.set(key, capitalizeText(raw));
                        }
                    });
                }
            });
            fillSelect('countrySelect', 'Country', Array.from(countries.entries()), 'selectedCountry');
            fillSelect('categorySelect', 'Category', Array.from(categories.entries()), 'selectedCategory');
            fillSelect('languageSelect', 'Language', Array.from(languages.entries()), 'selectedLanguage');
        }

        function fillSelect(id, label, options, storageKey) {
            const select = document.getElementById(id);
            select.innerHTML = `<option value="all">${label}: All</option>`;

            options.sort((a, b) => a[1].localeCompare(b[1]));

            options.forEach(([key, displayValue]) => {
                const opt = document.createElement('option');
                opt.value = key;
                opt.textContent = displayValue;
                select.appendChild(opt);
            });

            const savedVal = localStorage.getItem(storageKey);
            if (savedVal && options.some(o => o[0] === savedVal)) {
                select.value = savedVal;
            }
        }
