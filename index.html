<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STREMXBD - Live TV, Anime & Movies</title>
  <!-- Video.js for HLS Streaming -->
  <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      color: #38bdf8;
      font-size: 2.2rem;
      margin-bottom: 8px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Player Container */
    .player-wrapper {
      background: #1e293b;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: none;
    }

    .player-wrapper.active {
      display: block;
    }

    .player-title {
      font-size: 1.3rem;
      margin-bottom: 10px;
      color: #e2e8f0;
    }

    .video-js {
      width: 100%;
      height: 450px;
      border-radius: 8px;
      overflow: hidden;
    }

    /* Category Filter Tabs */
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .tab-btn.active, .tab-btn:hover {
      background: #0284c7;
      color: #fff;
      border-color: #38bdf8;
    }

    /* Grid Layout */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
    }

    .card {
      background: #1e293b;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid #334155;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(56, 189, 248, 0.2);
      border-color: #38bdf8;
    }

    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 6px;
      background-color: #334155;
      margin-bottom: 10px;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-badge {
      display: inline-block;
      margin-top: 6px;
      padding: 3px 8px;
      background: #0369a1;
      font-size: 0.75rem;
      border-radius: 4px;
      color: #e0f2fe;
    }

    /* Episode Selector Modal/Box */
    .episodes-container {
      margin-top: 15px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .ep-btn {
      background: #334155;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .ep-btn:hover {
      background: #0284c7;
    }

    #loading {
      text-align: center;
      font-size: 1.2rem;
      margin-top: 50px;
      color: #38bdf8;
    }

    @media (max-width: 600px) {
      .video-js {
        height: 240px;
      }
      .grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>STREMXBD</h1>
      <p>Watch Live TV, Movies & Anime</p>
    </header>

    <!-- Video Player Section -->
    <div class="player-wrapper" id="playerWrapper">
      <div class="player-title" id="playerTitle">Playing Content</div>
      <video id="my-video" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto"></video>
      <div class="episodes-container" id="episodesBox"></div>
    </div>

    <!-- Category Tabs -->
    <div class="tabs">
      <button class="tab-btn active" onclick="filterContent('all')">All</button>
      <button class="tab-btn" onclick="filterContent('tv-channel')">Live TV</button>
      <button class="tab-btn" onclick="filterContent('movie')">Movies</button>
      <button class="tab-btn" onclick="filterContent('anime')">Anime</button>
      <button class="tab-btn" onclick="filterContent('tv-series')">TV Series</button>
    </div>

    <!-- Content Grid -->
    <div id="loading">Loading content...</div>
    <div class="grid" id="contentGrid"></div>
  </div>

  <!-- Video.js Script -->
  <script src="https://vjs.zencdn.net/7.20.3/video.js"></script>

  <script>
    // RAW Github JSON URL
    const DATA_URL = "https://raw.githubusercontent.com/Sobujaka/STREMXBD/refs/heads/main/data.json";

    let rawData = [];
    let player = null;

    // Initialize Video.js Player
    document.addEventListener("DOMContentLoaded", () => {
      player = videojs('my-video');
      fetchData();
    });

    // Fetch Data from Raw Github
    async function fetchData() {
      try {
        // Cache Busting to avoid stale data
        const response = await fetch(`${DATA_URL}?t=${new Date().getTime()}`);
        const json = await response.json();
        rawData = json.data || [];
        document.getElementById('loading').style.display = 'none';
        renderContent(rawData);
      } catch (error) {
        console.error("Error loading JSON:", error);
        document.getElementById('loading').innerText = "Failed to load content. Please refresh!";
      }
    }

    // Render Cards in Grid
    function renderContent(items) {
      const grid = document.getElementById('contentGrid');
      grid.innerHTML = '';

      items.forEach(item => {
        // If type is TV Channel, handle nested CN objects
        if (item.type === 'tv-channel' && item.CN) {
          Object.keys(item.CN).forEach(key => {
            const ch = item.CN[key];
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => playMedia(ch.name, ch.url);
            card.innerHTML = `
              <img src="${ch.tvglogo || 'https://via.placeholder.com/160x230?text=TV+Channel'}" alt="${ch.name}" onerror="this.src='https://via.placeholder.com/160x230?text=No+Image'">
              <div class="card-title">${ch.name}</div>
              <span class="card-badge">${ch.group || 'LIVE TV'}</span>
            `;
            grid.appendChild(card);
          });
        } else {
          // Movies, Anime, TV Series
          const card = document.createElement('div');
          card.className = 'card';

          card.onclick = () => handleItemClick(item);
          card.innerHTML = `
            <img src="${item.image || 'https://via.placeholder.com/160x230?text=Media'}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/160x230?text=No+Image'">
            <div class="card-title">${item.name}</div>
            <span class="card-badge">${item.category || item.type.toUpperCase()}</span>
          `;
          grid.appendChild(card);
        }
      });
    }

    // Handle Item Click (Movies vs Series/Anime)
    function handleItemClick(item) {
      if (item.movielink) {
        playMedia(item.name, item.movielink);
        document.getElementById('episodesBox').innerHTML = '';
      } else if (item.episodes) {
        const epKeys = Object.keys(item.episodes);
        if (epKeys.length > 0) {
          // Play first episode by default
          playMedia(`${item.name} - ${epKeys[0]}`, item.episodes[epKeys[0]]);
          renderEpisodeButtons(item);
        }
      }
    }

    // Render Episode Buttons for Series
    function renderEpisodeButtons(item) {
      const epBox = document.getElementById('episodesBox');
      epBox.innerHTML = '<strong style="width:100%; font-size:0.9rem;">Episodes:</strong>';

      Object.keys(item.episodes).forEach(epKey => {
        const btn = document.createElement('button');
        btn.className = 'ep-btn';
        btn.innerText = epKey;
        btn.onclick = () => playMedia(`${item.name} - ${epKey}`, item.episodes[epKey]);
        epBox.appendChild(btn);
      });
    }

    // Play Media Stream
    function playMedia(title, streamUrl) {
      const wrapper = document.getElementById('playerWrapper');
      document.getElementById('playerTitle').innerText = title;
      wrapper.classList.add('active');

      // Scroll to player smooth
      wrapper.scrollIntoView({ behavior: 'smooth' });

      // Detect stream type (.m3u8 vs .mp4)
      let type = 'video/mp4';
      if (streamUrl.includes('.m3u8') || streamUrl.includes('/play/')) {
        type = 'application/x-mpegURL';
      }

      player.src({
        src: streamUrl,
        type: type
      });

      player.play();
    }

    // Filter Items by Category Tab
    function filterContent(type) {
      // Toggle Active Tab Button
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      if (type === 'all') {
        renderContent(rawData);
      } else {
        const filtered = rawData.filter(item => item.type === type);
        renderContent(filtered);
      }
    }
  </script>
</body>
</html>
