<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STREMXBD Streaming App</title>
    <!-- HLS.js for Streaming .m3u8 files -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b1120;
            color: #ffffff;
            padding: 20px;
        }

        #home-view { display: block; }

        .navbar {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            padding: 10px 0;
            margin-bottom: 25px;
        }

        .search-box {
            flex-grow: 1;
            min-width: 200px;
            background-color: #111827;
            border: 1px solid #1f2937;
            padding: 10px 18px;
            border-radius: 20px;
            color: #94a3b8;
            font-size: 14px;
            outline: none;
        }

        .nav-link {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            padding: 4px 8px;
        }

        .nav-link.active { color: #3b82f6; font-weight: 600; }

        .select-link {
            background: transparent;
            border: none;
            color: #3b82f6;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
        }

        .select-link option { background-color: #0f172a; color: #ffffff; }

        .media-grid {
            display: grid;
            grid-template-columns: repeat(8, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 30px;
        }

        .card {
            background-color: #161e2e;
            border-radius: 6px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            border: 1px solid #1f2937;
            transition: transform 0.2s, border-color 0.2s;
        }

        .card:hover { transform: translateY(-5px); border-color: #3b82f6; }

        .card-image-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 2 / 3;
            background-color: #0f172a;
        }

        .card-image-wrapper.square-box { aspect-ratio: 1 / 1; }

        .card img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .card-info { padding: 6px 8px; }

        .card-title {
            font-size: 11px;
            font-weight: 600;
            color: #f8fafc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-transform: capitalize;
        }

        #player-view {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #0b1120;
            z-index: 9999;
            padding: 20px;
            overflow-y: auto;
        }

        .back-btn {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .player-container {
            display: flex;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
            background: #0f172a;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #1f2937;
        }

        .player-main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .video-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        .video-wrapper iframe, .video-wrapper video {
            width: 100%;
            height: 100%;
            border: none;
        }

        .player-sidebar {
            width: 350px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #161e2e;
            padding: 15px;
            border-radius: 8px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .filter-group { display: flex; flex-direction: column; gap: 5px; }
        .filter-group label { font-size: 12px; color: #94a3b8; }
        .filter-group select {
            background: #0f172a;
            color: #fff;
            border: 1px solid #1f2937;
            padding: 8px;
            border-radius: 5px;
            outline: none;
        }

        .episodes-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .ep-btn {
            background: #0f172a;
            border: 1px solid #1f2937;
            color: #fff;
            padding: 8px 0;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
        }

        .ep-btn:hover, .ep-btn.active { background: #3b82f6; border-color: #3b82f6; }

        .channel-list { display: flex; flex-direction: column; gap: 8px; }

        .channel-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #0f172a;
            padding: 8px;
            border-radius: 5px;
            cursor: pointer;
            border: 1px solid #1f2937;
        }

        .channel-item:hover, .channel-item.active { border-color: #3b82f6; background: #1e293b; }
        .channel-item img { width: 35px; height: 35px; object-fit: contain; border-radius: 4px; }
        .channel-item span { font-size: 13px; font-weight: 500; }

        @media (max-width: 1024px) {
            .player-container { flex-direction: column; }
            .player-sidebar { width: 100%; max-height: none; }
            .media-grid { grid-template-columns: repeat(4, 1fr); }
        }
        @media (max-width: 600px) { .media-grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>

    <div id="home-view">
        <div class="navbar">
            <input type="text" id="searchInput" class="search-box" placeholder="Search title..." oninput="applyFilters()">
            <button class="nav-link active" onclick="filterTab('All', this)">All</button>
            <button class="nav-link" onclick="filterTab('Anime', this)">Anime</button>
            <button class="nav-link" onclick="filterTab('Movie', this)">Movie</button>
            <button class="nav-link" onclick="filterTab('TV Series', this)">TV Series</button>
            <button class="nav-link" onclick="filterTab('Live TV', this)">Live TV</button>

            <select id="countrySelect" class="select-link" onchange="applyFilters()"><option value="all">Country: All</option></select>
            <select id="categorySelect" class="select-link" onchange="applyFilters()"><option value="all">Category: All</option></select>
            <select id="languageSelect" class="select-link" onchange="applyFilters()"><option value="all">Language: All</option></select>
        </div>
        <div id="main-content"></div>
    </div>

    <div id="player-view">
        <button class="back-btn" onclick="closePlayerPage()">← Back to Home</button>
        <div class="player-container">
            <div class="player-main">
                <div class="video-wrapper" id="videoContainer">
                    <iframe id="iframePlayer" src="" allowfullscreen style="display:none;"></iframe>
                    <video id="html5Player" controls style="display:none;"></video>
                </div>
                <h2 id="videoTitle" style="font-size: 18px;"></h2>
            </div>
            <div id="playerSidebar" class="player-sidebar"></div>
        </div>
    </div>

    <script>
        const jsonSources = [
            { name: "Anime", url: "https://raw.githubusercontent.com/Sobujaka/STREMXBD/refs/heads/main/anime.json" },
            { name: "Movie", url: "https://raw.githubusercontent.com/Sobujaka/STREMXBD/refs/heads/main/movies.json" },
            { name: "TV Series", url: "https://raw.githubusercontent.com/Sobujaka/STREMXBD/refs/heads/main/tv-sriese.json" },
            { name: "Live TV", url: "https://raw.githubusercontent.com/Sobujaka/STREMXBD/refs/heads/main/live-tv.json" }
        ];

        let loadedData = {}, currentTab = 'All', hlsPlayer = null;

        async function loadAllJSON() {
            const fetchPromises = jsonSources.map(source => 
                fetch(source.url).then(res => res.json()).then(data => ({ category: source.name, data }))
            );
            const results = await Promise.allSettled(fetchPromises);
            results.forEach(result => {
                if (result.status === 'fulfilled') loadedData[result.value.category] = result.value.data;
            });
            populateDropdowns();
            applyFilters();
        }

        function populateDropdowns() {
            const countries = new Set(), categories = new Set(), languages = new Set();
            ['Anime', 'Movie', 'TV Series'].forEach(cat => {
                if (loadedData[cat]) {
                    loadedData[cat].forEach(item => {
                        if (item.country) countries.add(item.country);
                        if (item.category) categories.add(item.category);
                        if (item.language) languages.add(item.language);
                    });
                }
            });
            fillSelect('countrySelect', 'Country', Array.from(countries));
            fillSelect('categorySelect', 'Category', Array.from(categories));
            fillSelect('languageSelect', 'Language', Array.from(languages));
        }

        function fillSelect(id, label, options) {
            const select = document.getElementById(id);
            select.innerHTML = `<option value="all">${label}: All</option>`;
            options.forEach(opt => select.appendChild(new Option(opt, opt)));
        }

        function filterTab(tabName, element) {
            document.querySelectorAll('.nav-link').forEach(btn => btn.classList.remove('active'));
            if(element) element.classList.add('active');
            currentTab = tabName;
            const isLiveTV = tabName === 'Live TV';
            document.getElementById('countrySelect').disabled = isLiveTV;
            document.getElementById('categorySelect').disabled = isLiveTV;
            document.getElementById('languageSelect').disabled = isLiveTV;
            applyFilters();
        }

        function applyFilters() {
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const countryVal = document.getElementById('countrySelect').value;
            const categoryVal = document.getElementById('categorySelect').value;
            const languageVal = document.getElementById('languageSelect').value;

            let items = [];
            if (currentTab === 'All') {
                if (loadedData['Anime']) items.push(...loadedData['Anime']);
                if (loadedData['Movie']) items.push(...loadedData['Movie']);
                if (loadedData['TV Series']) items.push(...loadedData['TV Series']);
            } else if (loadedData[currentTab]) {
                items = loadedData[currentTab];
            }

            let filtered = items.filter(item => {
                if (currentTab === 'Live TV' || item.type === 'tv-channel') {
                    return (item.country || '').toLowerCase().includes(searchVal);
                }
                const title = (item.name || item.title || '').toLowerCase();
                return title.includes(searchVal) &&
                    (countryVal === 'all' || item.country === countryVal) &&
                    (categoryVal === 'all' || item.category === categoryVal) &&
                    (languageVal === 'all' || item.language === languageVal);
            });

            renderGrid(filtered);
        }

        function renderGrid(items) {
            const mainContent = document.getElementById('main-content');
            mainContent.innerHTML = '';
            const grid = document.createElement('div');
            grid.className = 'media-grid';

            items.forEach(item => {
                const isSquare = item.type === "tv-channel";
                const displayTitle = isSquare ? item.country : (item.name || item.title || "Untitled");
                const displayImage = item.image || "";

                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openPlayerPage(item);
                card.innerHTML = `
                    <div class="card-image-wrapper ${isSquare ? 'square-box' : ''}">
                        <img src="${displayImage}" alt="${displayTitle}">
                    </div>
                    <div class="card-info">
                        <div class="card-title">${displayTitle}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
            mainContent.appendChild(grid);
        }

        function openPlayerPage(item) {
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('player-view').style.display = 'block';

            const sidebar = document.getElementById('playerSidebar');
            sidebar.innerHTML = '';

            if (item.type === "tv-channel") {
                setupLiveTVPlayer(item, sidebar);
            } else if (item.episodes) {
                setupSeriesPlayer(item, sidebar);
            } else {
                setupMoviePlayer(item, sidebar);
            }
        }

        function setupMoviePlayer(item, sidebar) {
            sidebar.innerHTML = `
                <div class="filter-group">
                    <label>Language</label>
                    <select id="movieLangSelect"><option value="${item.language || 'Default'}">${item.language || 'Default'}</option></select>
                </div>`;
            loadVideo(item.link || item.url || '', item.name || item.title);
        }

        function setupSeriesPlayer(item, sidebar) {
            const seasonsMap = {};
            Object.keys(item.episodes).forEach(key => {
                const match = key.match(/(S\d+)(EP\d+)/i);
                if (match) {
                    const season = match[1].toUpperCase(), ep = match[2].toUpperCase();
                    if (!seasonsMap[season]) seasonsMap[season] = [];
                    seasonsMap[season].push({ epKey: key, epName: ep, url: item.episodes[key] });
                } else {
                    if (!seasonsMap['S1']) seasonsMap['S1'] = [];
                    seasonsMap['S1'].push({ epKey: key, epName: key, url: item.episodes[key] });
                }
            });

            let seasonOptions = '';
            Object.keys(seasonsMap).forEach(s => { seasonOptions += `<option value="${s}">Season ${s.replace('S', '')}</option>`; });

            sidebar.innerHTML = `
                <div class="filter-group"><label>Season</label><select id="seasonSelect">${seasonOptions}</select></div>
                <div class="filter-group"><label>Language</label><select id="langSelect"><option value="${item.language}">${item.language}</option></select></div>
                <div class="filter-group"><label>Episodes</label><div id="episodesGrid" class="episodes-grid"></div></div>
            `;

            const seasonSelect = document.getElementById('seasonSelect');
            const epGrid = document.getElementById('episodesGrid');

            function renderEpisodes(selectedSeason) {
                epGrid.innerHTML = '';
                const epList = seasonsMap[selectedSeason] || [];
                
                epList.forEach((epData, index) => {
                    const btn = document.createElement('button');
                    btn.className = 'ep-btn';
                    btn.innerText = epData.epName;
                    btn.onclick = () => {
                        document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        loadVideo(epData.url, `${item.name} - ${selectedSeason} ${epData.epName}`);
                    };
                    epGrid.appendChild(btn);
                    if (index === 0) btn.click();
                });
            }

            seasonSelect.onchange = (e) => renderEpisodes(e.target.value);
            renderEpisodes(Object.keys(seasonsMap)[0] || 'S1');
        }

        function setupLiveTVPlayer(item, sidebar) {
            const groups = new Set();
            if (item.CN) Object.values(item.CN).forEach(ch => { if(ch.group) groups.add(ch.group); });

            let groupOptions = '<option value="all">Group: All</option>';
            groups.forEach(g => groupOptions += `<option value="${g}">${g}</option>`);

            sidebar.innerHTML = `
                <div class="filter-group"><label>Group Filter</label><select id="groupSelect" onchange="filterChannels()">${groupOptions}</select></div>
                <div id="channelList" class="channel-list"></div>
            `;

            window.currentChannels = item.CN || {};
            renderChannels('all');
        }

        function filterChannels() {
            renderChannels(document.getElementById('groupSelect').value);
        }

        function renderChannels(group) {
            const container = document.getElementById('channelList');
            container.innerHTML = '';
            let isFirst = true;

            Object.values(window.currentChannels).forEach(ch => {
                if (group === 'all' || ch.group === group) {
                    const div = document.createElement('div');
                    div.className = 'channel-item';
                    div.onclick = () => {
                        document.querySelectorAll('.channel-item').forEach(c => c.classList.remove('active'));
                        div.classList.add('active');
                        loadVideo(ch.url, ch.name);
                    };
                    div.innerHTML = `<img src="${ch.tvglogo}" alt="${ch.name}"><span>${ch.name}</span>`;
                    container.appendChild(div);
                    if (isFirst) { div.click(); isFirst = false; }
                }
            });
        }

        /* SMART VIDEO PLAYER LOAD FUNCTION */
        function loadVideo(url, title) {
            const iframe = document.getElementById('iframePlayer');
            const video = document.getElementById('html5Player');
            document.getElementById('videoTitle').innerText = title || '';

            if (hlsPlayer) {
                hlsPlayer.destroy();
                hlsPlayer = null;
            }

            // Check if URL is .m3u8 or .mp4
            if (url.includes('.m3u8') || url.includes('.mp4')) {
                iframe.style.display = 'none';
                iframe.src = '';
                video.style.display = 'block';

                if (url.includes('.m3u8') && Hls.isSupported()) {
                    hlsPlayer = new Hls();
                    hlsPlayer.loadSource(url);
                    hlsPlayer.attachMedia(video);
                    hlsPlayer.on(Hls.Events.MANIFEST_PARSED, function() {
                        video.play();
                    });
                } else {
                    video.src = url;
                    video.play();
                }
            } else {
                // If Embed Link (YouTube, Streamtape, Vidhide, etc.)
                video.style.display = 'none';
                video.pause();
                iframe.style.display = 'block';
                iframe.src = url;
            }
        }

        function closePlayerPage() {
            document.getElementById('player-view').style.display = 'none';
            document.getElementById('home-view').style.display = 'block';
            document.getElementById('iframePlayer').src = '';
            const video = document.getElementById('html5Player');
            video.pause();
            if (hlsPlayer) {
                hlsPlayer.destroy();
                hlsPlayer = null;
            }
        }

        loadAllJSON();
    </script>
</body>
</html>
