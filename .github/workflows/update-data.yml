name: Update Secure Data JSON

on:
  schedule:
    - cron: '0 0,6,12,18 * * *' # দিনে ৪ বার চলবে (UTC Time)
  workflow_dispatch: # ম্যানুয়ালি রান করার অপশন

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Fetch Latest Tokenized Data from Cloudflare
        run: |
          curl -s "https://spring-voice-2488.jahangir339932.workers.dev/data.json" -o data.json

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update tokenized streams" && git push)
