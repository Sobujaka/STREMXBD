<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STREMXBD Streaming App</title>
    <!-- HLS.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- Artplayer.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js"></script>
    
    <!-- Firebase SDK (Version 8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b1120;
            color: #ffffff;
            padding: 20px;
        }

        #home-view { display: block; }

        .navbar {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            padding: 10px 0;
            margin-bottom: 25px;
            position: relative;
        }

        .brand-title {
            color: #3b82f6;
            font-size: 22px;
            font-weight: bold;
        }

        .search-box {
            flex-grow: 1;
            min-width: 200px;
            background-color: #111827;
            border: 1px solid #1f2937;
            padding: 10px 18px;
            border-radius: 20px;
            color: #94a3b8;
            font-size: 14px;
            outline: none;
        }

        .nav-link {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            padding: 4px 8px;
        }

        .nav-link.active { color: #3b82f6; font-weight: 600; }

        .select-link {
            background: transparent;
            border: none;
            color: #3b82f6;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
        }

        .select-link option { background-color: #0f172a; color: #ffffff; }

        /* Profile & Dropdown Styles */
        .profile-container { position: relative; margin-left: auto; z-index: 1000; }
        .profile-icon { 
            width: 38px; height: 38px; 
            border-radius: 50%; 
            background-color: #1f2937; 
            border: 2px solid #fbbf24; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
        }
        .profile-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .user-dropdown { 
            position: absolute; 
            top: 45px; right: 0; 
            background-color: #161e2e; 
            border: 1px solid #1f2937; 
            border-radius: 8px; 
            width: 240px; 
            display: none; 
            flex-direction: column; 
            box-shadow: 0 10px 15px rgba(0,0,0,0.5); 
            overflow: hidden; 
        }
        .user-dropdown.show { display: flex; }
        .dropdown-item { 
            padding: 12px 16px; 
            font-size: 14px; 
            color: #fff; 
            cursor: pointer; 
            border-bottom: 1px solid #1f2937; 
        }
        .dropdown-item:hover { background-color: #1f2937; }

        /* Premium Compact Box inside Dropdown */
        .dropdown-code-box {
            padding: 10px 12px;
            background-color: #0f172a;
            border-bottom: 1px solid #1f2937;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .code-input-wrapper {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .premium-input {
            flex: 1;
            min-width: 0;
            background-color: #161e2e;
            border: 1px solid #334155;
            color: #fff;
            padding: 6px 8px;
            font-size: 12px;
            border-radius: 4px;
            outline: none;
            transition: border-color 0.2s;
        }

        .premium-input:focus {
            border-color: #fbbf24;
        }

        .premium-btn {
            background-color: #fbbf24;
            color: #000;
            border: none;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            transition: background 0.2s;
        }

        .premium-btn:hover {
            background-color: #f59e0b;
        }

        /* Google Login Button Style */
        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: #ffffff;
            color: #000000;
            font-weight: 600;
            padding: 8px 12px;
            border-radius: 4px;
            margin: 8px 12px;
            cursor: pointer;
            font-size: 13px;
            border: none;
            transition: background 0.2s;
        }
        .google-btn:hover {
            background-color: #e2e8f0;
        }

        /* Premium Payment Modal */
        #payment-modal { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); 
            z-index: 10005; 
            overflow-y: auto; 
            padding: 20px; 
        }
        .payment-box { 
            background: #161e2e; 
            max-width: 500px; 
            margin: 30px auto; 
            padding: 25px; 
            border-radius: 12px; 
            border: 2px solid #fbbf24; 
        }
        .contact-icons { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        .contact-icon { width: 45px; height: 45px; cursor: pointer; transition: 0.3s; }
        .contact-icon:hover { transform: scale(1.1); }
        .price-item { display: flex; justify-content: space-between; padding: 12px; background: #0f172a; margin-bottom: 8px; border-radius: 6px; border: 1px solid #1e293b; }

        .media-grid {
            display: grid;
            grid-template-columns: repeat(8, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 30px;
        }

        .card {
            background-color: #161e2e;
            border-radius: 6px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            border: 1.5px solid #10b981;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }

        .card:hover { 
            transform: translateY(-5px); 
            border-color: #059669; 
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .card-image-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 2 / 3;
            background-color: #0f172a;
        }

        .card-image-wrapper.square-box { aspect-ratio: 1 / 1; }

        .card img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .card-info { padding: 6px 8px; }

        .card-title {
            font-size: 11px;
            font-weight: 600;
            color: #f8fafc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-transform: capitalize;
        }

        #player-view {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #0b1120;
            z-index: 9999;
            padding: 20px;
            overflow-y: auto;
        }

        .player-container {
            display: flex;
            gap: 20px;
            max-width: 1600px;
            margin: 0 auto;
            background: #0f172a;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #1f2937;
        }

        .player-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 0;
        }

        .player-title {
            font-size: 20px;
            font-weight: 600;
            color: #3b82f6;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-bottom: 2px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .server-buttons {
            display: inline-flex;
            gap: 8px;
            vertical-align: middle;
        }

        .server-btn {
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 4px 10px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .server-btn:hover, .server-btn.active {
            background: #3b82f6;
            color: #fff;
            border-color: #3b82f6;
        }

        .video-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .drive-icon-blocker {
            position: absolute;
            top: 0;
            right: 0;
            width: 60px;
            height: 60px;
            z-index: 10;
            background: transparent;
            pointer-events: auto;
        }

        .video-wrapper iframe, .artplayer-app {
            width: 100%;
            height: 100%;
            border: none;
        }

        .player-sidebar-wrapper {
            width: 300px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .back-btn {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            width: 100%;
            text-align: center;
            align-self: flex-end;
            transition: background 0.2s;
        }

        .back-btn:hover { background: #dc2626; }

        .player-sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #161e2e;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #1f2937;
            max-height: 78vh;
            overflow-y: auto;
        }

        .filter-group { display: flex; flex-direction: column; gap: 5px; }
        .filter-group label { font-size: 12px; color: #94a3b8; }
        .filter-group select {
            background: #0f172a;
            color: #fff;
            border: 1px solid #1f2937;
            padding: 8px;
            border-radius: 5px;
            outline: none;
        }

        .episodes-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .ep-btn {
            background: #0f172a;
            border: 1px solid #1f2937;
            color: #fff;
            padding: 8px 0;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
        }

        .ep-btn:hover, .ep-btn.active { background: #3b82f6; border-color: #3b82f6; }

        .channel-list { display: flex; flex-direction: column; gap: 8px; }

        .channel-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #0f172a;
            padding: 8px;
            border-radius: 5px;
            cursor: pointer;
            border: 1px solid #1f2937;
        }

        .channel-item:hover, .channel-item.active { border-color: #3b82f6; background: #1e293b; }
        .channel-item img { width: 35px; height: 35px; object-fit: contain; border-radius: 4px; }
        .channel-item span { font-size: 13px; font-weight: 500; }

        #adblock-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: rgba(11, 17, 32, 0.98);
            z-index: 999999;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .adblock-box {
            background-color: #161e2e;
            border: 2px solid #ef4444;
            padding: 30px;
            border-radius: 12px;
            max-width: 450px;
        }

        .adblock-box h2 { color: #ef4444; font-size: 22px; margin-bottom: 12px; }
        .adblock-box p { color: #94a3b8; font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
        .adblock-box button { background: #3b82f6; color: #fff; border: none; padding: 10px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; }

        @media (max-width: 1024px) {
            .player-container { flex-direction: column; }
            .player-sidebar-wrapper { width: 100%; }
            .media-grid { grid-template-columns: repeat(4, 1fr); }
        }

        @media (max-width: 600px) { 
            body { padding: 10px; }
            .media-grid { grid-template-columns: repeat(2, 1fr); } 
            #player-view { padding: 0; background-color: #0f172a; }
            .player-container { border-radius: 0; border: none; padding: 10px; gap: 12px; }
            .player-title { font-size: 15px; }
            .video-wrapper { border-radius: 6px; box-shadow: none; }
            .player-sidebar { max-height: none; padding: 10px; }
            .episodes-grid { grid-template-columns: repeat(4, 1fr); }
        }
    </style>
</head>
<body>

    <div id="adblock-overlay">
        <div class="adblock-box">
            <h2>AdBlocker Detected!</h2>
            <p>আপনার ব্রাউজারে অ্যাড ব্লকার চালু রয়েছে। দয়া করে অ্যাড ব্লকার ডিজেবল করুন এবং রিফ্রেশ দিন।</p>
            <button onclick="window.location.reload()">Refresh Page</button>
        </div>
    </div>

    <!-- Home View -->
    <div id="home-view">
        <div class="navbar">
            <span class="brand-title">STREMXBD</span>
            <input type="text" id="searchInput" class="search-box" placeholder="Search title..." oninput="applyFilters()">
            <button class="nav-link active" data-tab="All" onclick="filterTab('All', this)">All</button>
            <button class="nav-link" data-tab="Anime" onclick="filterTab('Anime', this)">Anime</button>
            <button class="nav-link" data-tab="Movie" onclick="filterTab('Movie', this)">Movie</button>
            <button class="nav-link" data-tab="TV Series" onclick="filterTab('TV Series', this)">TV Series</button>
            <button class="nav-link" data-tab="Live TV" onclick="filterTab('Live TV', this)">Live TV</button>

            <select id="countrySelect" class="select-link" onchange="applyFilters()"><option value="all">Country: All</option></select>
            <select id="categorySelect" class="select-link" onchange="applyFilters()"><option value="all">Category: All</option></select>
            <select id="languageSelect" class="select-link" onchange="applyFilters()"><option value="all">Language: All</option></select>

            <!-- User Profile & Premium Menu -->
            <div class="profile-container">
                <div class="profile-icon" id="profileIcon" onclick="toggleDropdown(event)">
                    <svg style="width:24px; height:24px; fill:#94a3b8" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
                </div>
                <div class="user-dropdown" id="userDropdown" onclick="event.stopPropagation()">
                    <div class="dropdown-item" id="user-info-tag" style="font-size: 12px; color: #94a3b8; display:none;"></div>
                    <div class="dropdown-item" id="status-tag" style="color: #fbbf24; font-weight: bold;">Status: Free User</div>
                    <div class="dropdown-item" onclick="openPayment()" style="background: #fbbf24; color: #000; font-weight: bold;">💎 Buy Premium</div>
                    
                    <!-- Integrated Compact Premium Code Input Box -->
                    <div class="dropdown-code-box">
                        <label style="font-size: 11px; color: #94a3b8; font-weight: 600;">🔑 Premium Code</label>
                        <div class="code-input-wrapper">
                            <input type="text" id="premiumCodeInput" class="premium-input" placeholder="Enter code...">
                            <button class="premium-btn" onclick="applyPremiumCode()">Apply</button>
                        </div>
                    </div>

                    <!-- Google Login Button -->
                    <button class="google-btn" id="googleAuthBtn" onclick="toggleGoogleLogin()">
                        <svg style="width:16px; height:16px" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                        <span id="googleBtnText">Login with Google</span>
                    </button>

                    <div class="dropdown-item" style="color: #ef4444;" onclick="localStorage.clear(); location.reload();">Reset App</div>
                </div>
            </div>
        </div>
        <div id="main-content"></div>
    </div>

    <!-- Payment Modal -->
    <div id="payment-modal">
        <div class="payment-box">
            <h2 style="text-align: center; color: #fbbf24;">💎 Subscribe Now</h2>
            <div style="margin: 20px 0;">
                <div class="price-item"><span>1 Month</span> <b>50 TK</b></div>
                <div class="price-item"><span>2 Months</span> <b>80 TK</b></div>
                <div class="price-item"><span>3 Months</span> <b>100 TK</b></div>
                <div class="price-item"><span>1 Year (Special)</span> <b>250 TK</b></div>
            </div>
            <p style="text-align: center; font-size: 13px; color: #94a3b8;">Contact Admin to purchase code:</p>
            <div class="contact-icons">
                <img class="contact-icon" src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" onclick="window.open('https://wa.me/8801795226250')">
                <img class="contact-icon" src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg" onclick="window.open('https://www.facebook.com/sobuj.akash.764212')">
                <img class="contact-icon" src="https://upload.wikimedia.org/wikipedia/commons/7/7e/Gmail_icon_%282020%29.svg" onclick="window.open('mailto:mel471081@gmail.com')">
            </div>
            <button onclick="closePayment()" style="width:100%; padding:12px; margin-top:25px; background:#ef4444; border:none; color:#fff; border-radius:6px; cursor:pointer; font-weight:bold;">CLOSE</button>
        </div>
    </div>

    <!-- Player View -->
    <div id="player-view">
        <div class="player-container">
            <div class="player-main">
                <h2 id="videoTitle" class="player-title"></h2>
                <div class="video-wrapper" id="videoContainer">
                    <div class="drive-icon-blocker"></div>
                    <iframe id="iframePlayer" src="" allowfullscreen style="display:none;"></iframe>
                    <div id="artPlayerContainer" class="artplayer-app" style="display:none;"></div>
                </div>
            </div>

            <div class="player-sidebar-wrapper">
                <button class="back-btn" onclick="closePlayerPage()">Back to Home →</button>
                <div id="playerSidebar" class="player-sidebar"></div>
            </div>
        </div>
    </div>

    <script>
        // --- Firebase Configuration ---
        // Firebase Console থেকে আপনার প্রোজেক্টের Config তথ্যগুলো নিচে বসিয়ে দিন
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Firebase Initialize
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const auth = firebase.auth();
        const googleProvider = new firebase.auth.GoogleAuthProvider();

        let currentUser = null;

        // User Auth State Change Listener
        auth.onAuthStateChanged((user) => {
            currentUser = user;
            const profileIcon = document.getElementById('profileIcon');
            const googleBtnText = document.getElementById('googleBtnText');
            const userInfoTag = document.getElementById('user-info-tag');

            if (user) {
                // User logged in
                profileIcon.innerHTML = `<img src="${user.photoURL || 'https://via.placeholder.com/38'}" alt="profile">`;
                googleBtnText.innerText = "Logout";
                userInfoTag.style.display = "block";
                userInfoTag.innerText = `👤 ${user.displayName || user.email}`;
            } else {
                // User logged out
                profileIcon.innerHTML = `<svg style="width:24px; height:24px; fill:#94a3b8" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>`;
                googleBtnText.innerText = "Login with Google";
                userInfoTag.style.display = "none";
            }
        });

        function toggleGoogleLogin() {
            if (currentUser) {
                auth.signOut().then(() => {
                    alert("Logged out successfully!");
                });
            } else {
                auth.signInWithPopup(googleProvider).then((result) => {
                    alert(`Welcome ${result.user.displayName}!`);
                }).catch((error) => {
                    alert("Login Failed: " + error.message);
                });
            }
        }

        // --- Premium Security System ---
        let isPremium = localStorage.getItem('isPremium') === 'true';
        let playbackTimer = null;

        if(!localStorage.getItem('deviceId')) {
            localStorage.setItem('deviceId', 'DEV-' + Math.random().toString(36).substr(2, 9).toUpperCase());
        }
        const myDeviceId = localStorage.getItem('deviceId');

        async function applyPremiumCode() {
            const codeInput = document.getElementById('premiumCodeInput');
            const enteredCode = codeInput ? codeInput.value.trim() : "";
            
            if (!enteredCode) {
                alert("Please enter a code!");
                return;
            }

            try {
                const res = await fetch('https://raw.githubusercontent.com/Sobujaka/STREMXBD/refs/heads/main/pemiumcode.json');
                const codes = await res.json();
                
                const found = codes.find(c => c.code.includes(enteredCode));

                if (found) {
                    if (found.usedBy && found.usedBy !== myDeviceId) {
                        alert("Error: This code is already used on another device!");
                        return;
                    }

                    if (found.code.includes('date=')) {
                        const dateStr = found.code.split('date="')[1].split('"')[0];
                        const [d, m, y] = dateStr.split('/').map(Number);
                        const expDate = new Date(y, m - 1, d);
                        if (new Date() > expDate) {
                            alert("Error: This code has expired!");
                            return;
                        }
                    }

                    isPremium = true;
                    localStorage.setItem('isPremium', 'true');
                    localStorage.setItem('activeCode', enteredCode);
                    alert("Success! Premium Activated on this device.");
                    location.reload();
                } else {
                    alert("Invalid Premium Code!");
                }
            } catch(e) { alert("Server Error! Try again later."); }
        }

        function updateUI() {
            const statusTag = document.getElementById('status-tag');
            if (statusTag) {
                statusTag.innerText = isPremium ? "Premium Active 💎" : "Status: Free User";
                if(isPremium) statusTag.style.color = "#fbbf24";
            }
        }

        function openPayment() { document.getElementById('payment-modal').style.display = 'block'; }
        function closePayment() { document.getElementById('payment-modal').style.display = 'none'; }
        
        function toggleDropdown(e) { 
            e.stopPropagation(); 
            document.getElementById('userDropdown').classList.toggle('show'); 
        }

        window.onclick = () => {
            const dropdown = document.getElementById('userDropdown');
            if (dropdown) dropdown.classList.remove('show');
        };

        // --- AdBlocker Logic ---
        async function checkAdBlocker() {
            const googleAdUrl = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js';
            try {
                await fetch(googleAdUrl, { method: 'HEAD', mode: 'no-cors' });
                const fakeAd = document.createElement('div');
                fakeAd.innerHTML = '&nbsp;';
                fakeAd.className = 'adsbox ads-box ad-zone ad-space google-ad';
                document.body.appendChild(fakeAd);
                
                setTimeout(() => {
                    if (fakeAd.offsetHeight === 0) showAdBlockWarning();
                    fakeAd.remove();
                }, 100);
            } catch (error) {
                showAdBlockWarning();
            }
        }

        function showAdBlockWarning() {
            document.getElementById('adblock-overlay').style.display = 'flex';
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('player-view').style.display = 'none';
        }

        window.addEventListener('load', checkAdBlocker);

        // --- Content & Player Core Logic ---
        const jsonSources = [
            { name: "Anime", url: "https://raw.githubusercontent.com/Sobujaka/STREMXBD/refs/heads/main/anime.json" },
            { name: "Movie", url: "https://raw.githubusercontent.com/Sobujaka/STREMXBD/refs/heads/main/movies.json" },
            { name: "TV Series", url: "https://raw.githubusercontent.com/Sobujaka/STREMXBD/refs/heads/main/tv-sriese.json" },
            { name: "Live TV", url: "https://raw.githubusercontent.com/Sobujaka/STREMXBD/refs/heads/main/live-tv.json" }
        ];

        let loadedData = {}, currentTab = 'All', artInstance = null, hlsInstance = null, streamTimeout = null;
        let previousScrollPosition = 0;
        let allFlatItems = [];

        function repairAndParseJSON(jsonText) {
            try {
                return JSON.parse(jsonText);
            } catch (e) {
                try {
                    let cleaned = jsonText.replace(/"\s*\n*\r*\s*"/g, '","')
                                         .replace(/([0-9]|"|true|false|null)\s*\n*\r*\s*"([^"]+)":/g, '$1,"$2":')
                                         .replace(/,\s*([\]}])/g, '$1');
                    return JSON.parse(cleaned);
                } catch (repairError) {
                    return new Function("return " + jsonText)();
                }
            }
        }

        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        async function loadAllJSON() {
            const fetchPromises = jsonSources.map(source => 
                fetch(source.url)
                    .then(res => res.text())
                    .then(textData => ({ category: source.name, data: repairAndParseJSON(textData) }))
                    .catch(err => ({ category: source.name, data: [] }))
            );

            const results = await Promise.allSettled(fetchPromises);
            results.forEach(result => {
                if (result.status === 'fulfilled' && result.value.data) {
                    loadedData[result.value.category] = result.value.data;
                }
            });

            restoreState();
            populateDropdowns();
            applyFilters();
            checkAndRestorePlayerFromHash();
            updateUI();
        }

        function restoreState() {
            const savedTab = localStorage.getItem('selectedTab');
            if (savedTab) {
                currentTab = savedTab;
                document.querySelectorAll('.nav-link').forEach(btn => {
                    if (btn.getAttribute('data-tab') === currentTab) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });
            }

            const savedSearch = localStorage.getItem('searchVal');
            if (savedSearch) document.getElementById('searchInput').value = savedSearch;
        }

        function capitalizeText(str) {
            if (!str) return '';
            return str.toLowerCase().split(' ').map(word => {
                if (word.includes('&')) {
                    return word.split('&').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join('&');
                }
                return word.charAt(0).toUpperCase() + word.slice(1);
            }).join(' ');
        }

        function populateDropdowns() {
            const countries = new Map(), categories = new Map(), languages = new Map();
            ['Anime', 'Movie', 'TV Series'].forEach(cat => {
                if (loadedData[cat] && Array.isArray(loadedData[cat])) {
                    loadedData[cat].forEach(item => {
                        if (item.country) {
                            const raw = item.country.trim();
                            const key = raw.toLowerCase();
                            if (!countries.has(key)) countries.set(key, capitalizeText(raw));
                        }
                        
                        if (item.category) {
                            const catList = item.category.split(/[,/]+/).map(c => c.trim());
                            catList.forEach(c => {
                                if (c) {
                                    const key = c.toLowerCase();
                                    if (!categories.has(key)) categories.set(key, capitalizeText(c));
                                }
                            });
                        }
                        
                        if (item.language) {
                            const raw = item.language.trim();
                            const key = raw.toLowerCase();
                            if (!languages.has(key)) languages.set(key, capitalizeText(raw));
                        }
                    });
                }
            });
            fillSelect('countrySelect', 'Country', Array.from(countries.entries()), 'selectedCountry');
            fillSelect('categorySelect', 'Category', Array.from(categories.entries()), 'selectedCategory');
            fillSelect('languageSelect', 'Language', Array.from(languages.entries()), 'selectedLanguage');
        }

        function fillSelect(id, label, options, storageKey) {
            const select = document.getElementById(id);
            select.innerHTML = `<option value="all">${label}: All</option>`;
            
            options.sort((a, b) => a[1].localeCompare(b[1]));

            options.forEach(([key, displayValue]) => {
                const opt = document.createElement('option');
                opt.value = key;
                opt.textContent = displayValue;
                select.appendChild(opt);
            });
            
            const savedVal = localStorage.getItem(storageKey);
            if (savedVal && options.some(o => o[0] === savedVal)) {
                select.value = savedVal;
            }
        }

        function filterTab(tabName, element) {
            document.querySelectorAll('.nav-link').forEach(btn => btn.classList.remove('active'));
            if(element) element.classList.add('active');
            currentTab = tabName;
            localStorage.setItem('selectedTab', tabName);

            const isLiveTV = tabName === 'Live TV';
            document.getElementById('countrySelect').disabled = isLiveTV;
            document.getElementById('categorySelect').disabled = isLiveTV;
            document.getElementById('languageSelect').disabled = isLiveTV;
            applyFilters();
        }

        function applyFilters() {
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const countryVal = document.getElementById('countrySelect').value;
            const categoryVal = document.getElementById('categorySelect').value;
            const languageVal = document.getElementById('languageSelect').value;

            localStorage.setItem('searchVal', searchVal);
            localStorage.setItem('selectedCountry', countryVal);
            localStorage.setItem('selectedCategory', categoryVal);
            localStorage.setItem('selectedLanguage', languageVal);

            let items = [];
            if (currentTab === 'All') {
                if (loadedData['Anime']) items.push(...loadedData['Anime']);
                if (loadedData['Movie']) items.push(...loadedData['Movie']);
                if (loadedData['TV Series']) items.push(...loadedData['TV Series']);
            } else if (loadedData[currentTab]) {
                items = loadedData[currentTab];
            }

            let filtered = items.filter(item => {
                if (!item) return false;
                if (currentTab === 'Live TV' || item.type === 'tv-channel') {
                    return (item.country || '').toLowerCase().includes(searchVal);
                }
                const title = (item.name || item.title || '').toLowerCase();
                
                const itemCategories = item.category ? item.category.split(/[,/]+/).map(c => c.trim().toLowerCase()) : [];
                const matchesCategory = categoryVal === 'all' || itemCategories.includes(categoryVal);

                const itemCountry = (item.country || '').trim().toLowerCase();
                const itemLanguage = (item.language || '').trim().toLowerCase();

                return title.includes(searchVal) &&
                    (countryVal === 'all' || itemCountry === countryVal) &&
                    matchesCategory &&
                    (languageVal === 'all' || itemLanguage === languageVal);
            });

            const grouped = groupItemsByName(filtered);
            allFlatItems = grouped;
            renderGrid(currentTab !== 'Live TV' ? shuffleArray(grouped) : grouped);
        }

        function groupItemsByName(items) {
            const map = new Map();
            items.forEach(item => {
                if (!item) return;
                if (item.type === "tv-channel") {
                    const key = "tv_" + item.country;
                    if (!map.has(key)) map.set(key, item);
                    return;
                }
                const title = (item.name || item.title || "Untitled").trim();
                const key = title.toLowerCase();

                if (!map.has(key)) {
                    map.set(key, { ...item, title: title, languagesMap: { [item.language || 'Default']: item } });
                } else {
                    map.get(key).languagesMap[item.language || 'Default'] = item;
                }
            });
            return Array.from(map.values());
        }

        function renderGrid(items) {
            const mainContent = document.getElementById('main-content');
            mainContent.innerHTML = '';
            const grid = document.createElement('div');
            grid.className = 'media-grid';

            items.forEach(item => {
                const isSquare = item.type === "tv-channel";
                const displayTitle = isSquare ? item.country : (item.title || item.name || "Untitled");
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openPlayerPage(item);
                card.innerHTML = `
                    <div class="card-image-wrapper ${isSquare ? 'square-box' : ''}">
                        <img src="${item.image || ''}" alt="${displayTitle}">
                    </div>
                    <div class="card-info">
                        <div class="card-title">${displayTitle}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
            mainContent.appendChild(grid);
        }

        function checkAndRestorePlayerFromHash() {
            if (window.location.hash.startsWith('#player')) {
                try {
                    const hashData = decodeURIComponent(window.location.hash.substring(8));
                    const params = new URLSearchParams(hashData);
                    const title = params.get('title');
                    const country = params.get('country');

                    let matchedItem = null;
                    if (country) {
                        Object.values(loadedData).forEach(cat => {
                            if (Array.isArray(cat)) {
                                cat.forEach(i => { if (i.type === 'tv-channel' && i.country === country) matchedItem = i; });
                            }
                        });
                    } else if (title) {
                        matchedItem = allFlatItems.find(i => (i.title || i.name) === title);
                    }

                    if (matchedItem) {
                        openPlayerPage(matchedItem, false);
                    }
                } catch(e) {}
            }
        }

        function openPlayerPage(item, updateHash = true) {
            // Live TV Premium Restriction Check
            if ((currentTab === 'Live TV' || item.type === 'tv-channel') && !isPremium) {
                alert('Live TV is only available for Premium Users!');
                openPayment();
                return;
            }

            previousScrollPosition = window.scrollY || document.documentElement.scrollTop;
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('player-view').style.display = 'block';
            document.getElementById('player-view').scrollTop = 0;

            const displayTitle = item.type === "tv-channel" ? item.country : (item.title || item.name || "Untitled");
            if (updateHash) {
                const paramKey = item.type === "tv-channel" ? `country=${encodeURIComponent(item.country)}` : `title=${encodeURIComponent(displayTitle)}`;
                window.location.hash = `player?${paramKey}`;
            }

            const sidebar = document.getElementById('playerSidebar');
            sidebar.innerHTML = '';

            if (item.type === "tv-channel") {
                setupLiveTVPlayer(item, sidebar);
            } else if (item.episodes || (item.languagesMap && Object.values(item.languagesMap)[0].episodes)) {
                setupSeriesPlayer(item, sidebar);
            } else {
                setupMoviePlayer(item, sidebar);
            }

            // Free User Playback Limit (5 Minutes Timer)
            if (!isPremium) {
                if (playbackTimer) clearTimeout(playbackTimer);
                playbackTimer = setTimeout(() => {
                    closePlayerPage();
                    alert('Free 5 Minutes Finished! Buy Premium Code to watch full.');
                    openPayment();
                }, 5 * 60 * 1000);
            }
        }

        function setupMoviePlayer(item, sidebar) {
            const languagesMap = item.languagesMap || { [item.language || 'Default']: item };
            const langKeys = Object.keys(languagesMap);
            let langOptions = langKeys.map(lang => `<option value="${lang}">${lang}</option>`).join('');

            sidebar.innerHTML = `<div class="filter-group"><label>Language</label><select id="movieLangSelect">${langOptions}</select></div>`;
            const langSelect = document.getElementById('movieLangSelect');

            function playSelectedLanguage(lang) {
                const currentItem = languagesMap[lang] || item;
                const movieUrl = currentItem["Movie link"] || currentItem["movie_link"] || currentItem.link || currentItem.url || '';
                loadVideo(movieUrl, `${currentItem.title || currentItem.name} (${lang})`);
            }
            langSelect.onchange = (e) => playSelectedLanguage(e.target.value);
            playSelectedLanguage(langKeys[0]);
        }

        function setupSeriesPlayer(item, sidebar) {
            const languagesMap = item.languagesMap || { [item.language || 'Default']: item };
            const langKeys = Object.keys(languagesMap);
            let langOptions = langKeys.map(lang => `<option value="${lang}">${lang}</option>`).join('');

            sidebar.innerHTML = `
                <div class="filter-group"><label>Language</label><select id="langSelect">${langOptions}</select></div>
                <div class="filter-group"><label>Season</label><select id="seasonSelect"></select></div>
                <div class="filter-group"><label>Episodes</label><div id="episodesGrid" class="episodes-grid"></div></div>
            `;

            const langSelect = document.getElementById('langSelect');
            const seasonSelect = document.getElementById('seasonSelect');
            const epGrid = document.getElementById('episodesGrid');

            function loadSeriesContent(selectedLang) {
                const activeItem = languagesMap[selectedLang] || item;
                const episodes = activeItem.episodes || {};
                const seasonsMap = {};

                Object.keys(episodes).forEach(key => {
                    const match = key.match(/(S\d+)(EP\d+)/i);
                    if (match) {
                        const season = match[1].toUpperCase(), ep = match[2].toUpperCase();
                        if (!seasonsMap[season]) seasonsMap[season] = [];
                        seasonsMap[season].push({ epName: ep, url: episodes[key] });
                    } else {
                        if (!seasonsMap['S1']) seasonsMap['S1'] = [];
                        seasonsMap['S1'].push({ epName: key, url: episodes[key] });
                    }
                });

                seasonSelect.innerHTML = Object.keys(seasonsMap).map(s => `<option value="${s}">Season ${s.replace('S', '')}</option>`).join('');

                function renderEpisodes(selectedSeason) {
                    epGrid.innerHTML = '';
                    (seasonsMap[selectedSeason] || []).forEach((epData, index) => {
                        const btn = document.createElement('button');
                        btn.className = 'ep-btn';
                        btn.innerText = epData.epName;
                        btn.onclick = () => {
                            document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
                            btn.classList.add('active');
                            loadVideo(epData.url, `${activeItem.title || activeItem.name} - ${selectedSeason} ${epData.epName}`);
                        };
                        epGrid.appendChild(btn);
                        if (index === 0) btn.click();
                    });
                }
                seasonSelect.onchange = (e) => renderEpisodes(e.target.value);
                renderEpisodes(Object.keys(seasonsMap)[0] || 'S1');
            }
            langSelect.onchange = (e) => loadSeriesContent(e.target.value);
            loadSeriesContent(langKeys[0]);
        }

        function setupLiveTVPlayer(item, sidebar) {
            const groups = new Set();
            const uniqueChannels = {};

            if (item.CN) {
                Object.values(item.CN).forEach(ch => {
                    if (ch.group) groups.add(ch.group);
                    const chNameKey = ch.name.trim().toLowerCase();

                    if (!uniqueChannels[chNameKey]) {
                        uniqueChannels[chNameKey] = {
                            name: ch.name,
                            tvglogo: ch.tvglogo,
                            group: ch.group,
                            links: [ch.url]
                        };
                    } else {
                        if (!uniqueChannels[chNameKey].links.includes(ch.url)) {
                            uniqueChannels[chNameKey].links.push(ch.url);
                        }
                    }
                });
            }

            let groupOptions = '<option value="all">Group: All</option>';
            groups.forEach(g => groupOptions += `<option value="${g}">${g}</option>`);

            sidebar.innerHTML = `
                <div class="filter-group"><label>Group Filter</label><select id="groupSelect" onchange="filterChannels()">${groupOptions}</select></div>
                <div id="channelList" class="channel-list"></div>
            `;
            window.currentChannels = uniqueChannels;
            renderChannels('all');
        }

        function filterChannels() {
            renderChannels(document.getElementById('groupSelect').value);
        }

        function renderChannels(group) {
            const container = document.getElementById('channelList');
            container.innerHTML = '';
            let isFirst = true;

            Object.values(window.currentChannels).forEach(ch => {
                if (group === 'all' || ch.group === group) {
                    const div = document.createElement('div');
                    div.className = 'channel-item';
                    div.onclick = () => {
                        document.querySelectorAll('.channel-item').forEach(c => c.classList.remove('active'));
                        div.classList.add('active');
                        playChannelWithButtons(ch.links, ch.name, 0);
                    };
                    div.innerHTML = `<img src="${ch.tvglogo}" alt="${ch.name}"><span>${ch.name}</span>`;
                    container.appendChild(div);
                    if (isFirst) { div.click(); isFirst = false; }
                }
            });
        }

        function playChannelWithButtons(urls, title, activeIndex = 0) {
            if (!urls || urls.length === 0) return;

            const titleContainer = document.getElementById('videoTitle');
            
            let buttonsHTML = '';
            if (urls.length > 1) {
                buttonsHTML = '<div class="server-buttons">';
                urls.forEach((_, idx) => {
                    const activeClass = idx === activeIndex ? 'active' : '';
                    buttonsHTML += `<button class="server-btn ${activeClass}" onclick="switchServer(${idx})">Server ${idx + 1}</button>`;
                });
                buttonsHTML += '</div>';
            }

            titleContainer.innerHTML = `<span>${title}</span> ${buttonsHTML}`;

            window.switchServer = (index) => {
                playChannelWithButtons(urls, title, index);
            };

            loadVideo(urls[activeIndex], `${title} (Server ${activeIndex + 1})`, () => {
                console.log(`Server ${activeIndex + 1} failed.`);
            });
        }

        function destroyPlayers() {
            if (streamTimeout) {
                clearTimeout(streamTimeout);
                streamTimeout = null;
            }
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }
            if (artInstance) {
                artInstance.destroy();
                artInstance = null;
            }
        }

        function loadVideo(url, title, onErrorCallback = null) {
            const iframe = document.getElementById('iframePlayer');
            const artContainer = document.getElementById('artPlayerContainer');
            
            const videoTitleEl = document.getElementById('videoTitle');
            if (!videoTitleEl.querySelector('.server-buttons')) {
                videoTitleEl.innerText = title || '';
            }

            destroyPlayers();

            if (!url) {
                if (onErrorCallback) onErrorCallback();
                return;
            }

            const cleanUrl = url.trim();
            const lowerUrl = cleanUrl.toLowerCase();

            const isProxyStream = lowerUrl.includes('workers.dev') || lowerUrl.includes('/stream') || lowerUrl.includes('.m3u8');
            const isDirectVideo = lowerUrl.includes('.mp4') || lowerUrl.includes('.mkv');

            if (isProxyStream || isDirectVideo) {
                iframe.style.display = 'none';
                iframe.src = '';
                artContainer.style.display = 'block';

                let hasTriggeredError = false;
                const handleError = () => {
                    if (!hasTriggeredError) {
                        hasTriggeredError = true;
                        destroyPlayers();
                        if (onErrorCallback) onErrorCallback();
                    }
                };

                streamTimeout = setTimeout(() => {
                    handleError();
                }, 8000);

                artInstance = new Artplayer({
                    container: '#artPlayerContainer',
                    url: cleanUrl,
                    type: lowerUrl.includes('.m3u8') ? 'm3u8' : 'auto',
                    customType: {
                        m3u8: function (video, videoUrl) {
                            if (Hls.isSupported()) {
                                hlsInstance = new Hls({
                                    enableWorker: true,
                                    lowLatencyMode: false,
                                    maxBufferLength: 60,
                                    maxMaxBufferLength: 120,
                                    maxBufferSize: 60 * 1024 * 1024,
                                    maxBufferHole: 0.5,
                                    highBufferWatchdogPeriod: 2,
                                    nudgeMaxRetry: 5
                                });
                                hlsInstance.loadSource(videoUrl);
                                hlsInstance.attachMedia(video);
                                
                                hlsInstance.on(Hls.Events.MANIFEST_PARSED, function () {
                                    if (streamTimeout) {
                                        clearTimeout(streamTimeout);
                                        streamTimeout = null;
                                    }
                                });

                                hlsInstance.on(Hls.Events.ERROR, function (event, data) {
                                    if (data.fatal) {
                                        handleError();
                                    }
                                });
                            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                                video.src = videoUrl;
                                video.addEventListener('loadedmetadata', () => {
                                    if (streamTimeout) {
                                        clearTimeout(streamTimeout);
                                        streamTimeout = null;
                                    }
                                });
                                video.addEventListener('error', handleError);
                            }
                        },
                    },
                    autoplay: true,
                    pip: true,
                    screenshot: true,
                    fullscreen: true,
                    fullscreenWeb: true,
                    theme: '#3b82f6',
                });

                artInstance.on('video:playing', () => {
                    if (streamTimeout) {
                        clearTimeout(streamTimeout);
                        streamTimeout = null;
                    }
                });

                artInstance.on('error', handleError);

            } else {
                artContainer.style.display = 'none';
                iframe.style.display = 'block';
                iframe.src = cleanUrl;
            }
        }

        function closePlayerPage() {
            if (playbackTimer) {
                clearTimeout(playbackTimer);
                playbackTimer = null;
            }
            window.location.hash = '';
            document.getElementById('player-view').style.display = 'none';
            document.getElementById('home-view').style.display = 'block';
            window.scrollTo(0, previousScrollPosition);
            document.getElementById('iframePlayer').src = '';
            destroyPlayers();
        }

        loadAllJSON();
    </script>
